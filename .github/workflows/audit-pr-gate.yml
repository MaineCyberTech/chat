name: audit-pr-gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Evaluate audit gate policy
        run: |
          if find docs/audits/runs -name '*_summary.json' -print -quit 2>/dev/null | grep -q .; then
            python scripts/audits/aggregate_runs.py
            python scripts/audits/evaluate_gate.py --repo-root . --policy-file docs/hardening_super_bundle/policies/gate-policy.dev.json
          else
            echo "No audit run summaries are tracked; skipping the gate."
            mkdir -p docs/hardening_super_bundle/examples/results
            printf '# Audit Gate Result\n\n## Gate Status: SKIP\n\n- No audit run summaries are present in the repository.\n' \
              > docs/hardening_super_bundle/examples/results/generated_gate_result.md
          fi
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-gate-result
          path: docs/hardening_super_bundle/examples/results/generated_gate_result.md
          if-no-files-found: warn
