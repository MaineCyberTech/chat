name: Load Test

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC

permissions:
  contents: read

jobs:
  k6-smoke-test:
    name: k6 Smoke Test
    # The smoke test only runs when an API origin is configured. This avoids a
    # permanently red scheduled job pointed at a decommissioned placeholder
    # hostname, and makes the skip explicit in the run summary.
    if: ${{ vars.SMOKE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run k6 smoke test
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with:
          filename: tests/k6/smoke-test.js
          flags: --vus 10 --duration 30s
        env:
          BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          HEALTH_PATH: ${{ vars.SMOKE_HEALTH_PATH || '/health' }}
