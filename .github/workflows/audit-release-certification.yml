name: audit-release-certification

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Audit run ID to certify
        required: true
        type: string

jobs:
  release-certification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Generate release report
        run: |
          python scripts/audits/generate_release_candidate_report.py --repo-root . --run-id "${{ inputs.run_id }}"

      - name: Export stakeholder pack
        run: |
          python scripts/audits/export_stakeholder_pack.py --repo-root . --run-id "${{ inputs.run_id }}"

      - name: Upload release certification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-certification-${{ inputs.run_id }}
          path: |
            docs/audits/runs/${{ inputs.run_id }}/release_candidate_report.md
            docs/audits/runs/${{ inputs.run_id }}/stakeholder_export/**
          if-no-files-found: error
