name: executive-stakeholder-pack
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Hardening run ID
        required: true
        type: string
jobs:
  executive-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/hardening_runner/generate_executive_stakeholder_pack.py --repo-root . --run-id "${{ inputs.run_id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executive-pack-${{ inputs.run_id }}
          path: docs/hardening_runs/${{ inputs.run_id }}/executive_pack/**
          if-no-files-found: error
