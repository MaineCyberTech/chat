name: executive-stakeholder-pack
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Hardening run ID
        required: true
        type: string
jobs:
  executive-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/hardening_runner/generate_executive_stakeholder_pack.py --repo-root . --run-id "${{ inputs.run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executive-pack-${{ inputs.run_id }}
          path: docs/hardening_runs/${{ inputs.run_id }}/executive_pack/**
          if-no-files-found: error
