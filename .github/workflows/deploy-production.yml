name: Provision + Deploy — Production
# HOTFIX PROCESS:
# 1. Create branch from main
# 2. Apply minimal fix, get PR review
# 3. Use workflow_dispatch with inputs.hotfix=true
# 4. Post hotfix notification to #operations after deploy
# 5. Schedule post-mortem within 24 hours

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "SHA to rollback to (leave empty for latest)"
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: production
  DOMAIN: mainecybertech.com
  REPO_DIR: /opt/chat

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  provision:
    name: Provision Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    # Protected environment (required reviewers) so destructive
    # terraform apply cannot run before a human approves it.
    environment: production
    timeout-minutes: 10
    outputs:
      droplet_ip: ${{ steps.terraform.outputs.droplet_ip }}
      frontend_url: ${{ steps.terraform.outputs.frontend_url }}
      api_url: ${{ steps.terraform.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Import existing resources
        id: import
        env:
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_ssh_allowed_ips: ${{ secrets.SSH_ALLOWED_IPS }}
        run: |
          cd infra/terraform
          DROPLET_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-${ENVIRONMENT}" '.droplets[] | select(.name==$name) | .id')
          if [ -n "$DROPLET_ID" ]; then
            echo "Importing existing droplet $DROPLET_ID"
            terraform import digitalocean_droplet.chat "$DROPLET_ID" || true
            terraform import digitalocean_firewall.chat "$DROPLET_ID" || true
          fi
          echo "exists=$([ -n "$DROPLET_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "droplet_id=$DROPLET_ID" >> "$GITHUB_OUTPUT"

      - name: Destroy old extra droplets
        if: steps.import.outputs.exists == 'true'
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-${ENVIRONMENT}" '.droplets[] | select(.name==$name and .id!="${{ steps.import.outputs.droplet_id }}") | .id' \
            | while read -r OLD_ID; do
              echo "Deleting extra droplet $OLD_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID"
            done
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/firewalls?page=1&per_page=200" \
            | jq -r --arg prefix "chat-${ENVIRONMENT}" '.firewalls[] | select(.name | startswith($prefix)) | .id' \
            | while read -r FW_ID; do
              echo "Deleting old firewall $FW_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/firewalls/$FW_ID"
            done

      - name: Cleanup duplicate DNS records
        run: |
          ZONE_ID="${{ secrets.CF_ZONE_ID }}"
          TOKEN="${{ secrets.CF_API_TOKEN }}"
          for NAME in chat chat-api; do
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=${NAME}.${{ env.DOMAIN }}" \
              | jq -r '.result[]?.id' | while read -r ID; do
                echo "Deleting old DNS record $NAME (id=$ID)"
                curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID"
              done
          done

      - name: Terraform Apply
        id: terraform
        working-directory: infra/terraform
        env:
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_ssh_allowed_ips: ${{ secrets.SSH_ALLOWED_IPS }}
        run: |
          terraform apply -auto-approve -input=false
          {
            echo "droplet_ip=$(terraform output -raw droplet_ip)"
            echo "frontend_url=https://chat.${{ env.DOMAIN }}"
            echo "api_url=https://chat-api.${{ env.DOMAIN }}"
          } >> "$GITHUB_OUTPUT"

  build-images:
    name: Build and Push Images
    needs: provision
    runs-on: ubuntu-latest
    # Gate image publication behind the same protected production environment.
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase repo and build time
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:latest
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/worker:latest
            ghcr.io/${{ env.REPO_LC }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.mainecybertech.com
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.com
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:latest
            ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SBOMs for every image this job pushes to production (SUPPLY-P2-004).
      - name: Generate SBOM (SPDX) - API
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sbom-api
          path: apps/api
          format: spdx-json

      - name: Generate SBOM (SPDX) - Worker
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sbom-worker
          path: apps/worker
          format: spdx-json

      - name: Generate SBOM (SPDX) - Web
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sbom-web
          path: apps/web
          format: spdx-json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-production
          path: |
            sbom-api.spdx.json
            sbom-worker.spdx.json
            sbom-web.spdx.json

  deploy:
    name: Deploy to Production
    needs: [build-images, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          strict_host_key_checking: true
          script: |
            if [ ! -d "${{ env.REPO_DIR }}" ]; then
              git clone https://github.com/${{ github.repository }}.git ${{ env.REPO_DIR }}
            fi
            cd ${{ env.REPO_DIR }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            set +x
            cat > infra/docker/.env << 'EOF'
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.${{ env.DOMAIN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://chat.${{ env.DOMAIN }}
            PORT=4000
            NODE_ENV=production
            API_BASE_URL=https://chat-api.${{ env.DOMAIN }}
            FRONTEND_URL=https://chat.${{ env.DOMAIN }}
            DOMAIN=${{ env.DOMAIN }}
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
            LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            METRICS_TOKEN=${{ secrets.METRICS_TOKEN }}
            CHAT_NTFY_URL=https://ntfy.mainecybertech.us/chat-alerts
            CHAT_NTFY_USER=chat-relay
            CHAT_NTFY_PASS=${{ secrets.CHAT_NTFY_PASS }}
            EOF
            chmod 600 infra/docker/.env
            CERT_DIR=/opt/chat/infra/docker/certs
            mkdir -p "$CERT_DIR"
            echo "${{ secrets.CF_ORIGIN_CERT }}" > "$CERT_DIR/fullchain.pem"
            echo "${{ secrets.CF_ORIGIN_KEY }}" > "$CERT_DIR/privkey.pem"
            chmod 600 "$CERT_DIR/privkey.pem"
            set -x
            mkdir -p /opt/chat/caddy-data /opt/chat/caddy-config

      - name: Deploy containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          strict_host_key_checking: true
          script: |
            cd ${{ env.REPO_DIR }}

            exec 200>/tmp/chat-deploy.lock
            flock -n 200 || { echo "Deploy already in progress (locked by /tmp/chat-deploy.lock)"; exit 1; }

            set +x
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            set -x

            # Aggressive disk cleanup before pulling
            echo "=== Disk usage before cleanup ==="
            df -h /
            docker system df -v

            # Stop and remove all containers first
            docker compose -f infra/docker/docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            # Remove unused images, build cache, and networks (NOT volumes; preserve named data volumes like redis-data)
            docker system prune -af
            docker builder prune -af
            docker image prune -af --filter "until=24h"

            echo "=== Disk usage after cleanup ==="
            df -h /

            COMMIT_SHA=${{ github.sha }}

            for img in api worker web; do
              for attempt in 1 2 3; do
                if docker pull ghcr.io/${{ env.REPO_LC }}/$img:$COMMIT_SHA; then
                  docker tag ghcr.io/${{ env.REPO_LC }}/$img:$COMMIT_SHA ghcr.io/${{ env.REPO_LC }}/$img:latest
                  echo "Successfully pulled $img:$COMMIT_SHA"
                  break
                fi
                echo "Attempt $attempt failed for $img:$COMMIT_SHA, retrying in 5s..."
                sleep 5
              done
            done

            docker compose -f infra/docker/docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -af
            flock -u 200

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.provision.outputs.api_url }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy at ${{ needs.provision.outputs.api_url }}"
              exit 0
            fi
            echo "Attempt $i: returned $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Cleanup .env files
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          strict_host_key_checking: true
          script: |
            shred -u ${{ env.REPO_DIR }}/infra/docker/.env 2>/dev/null || true

  rollback:
    name: Rollback to Previous Version
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha != ''
    needs: [provision]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Rollback to SHA
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          strict_host_key_checking: true
          script: |
            cd ${{ env.REPO_DIR }}
            set +x
            cat > infra/docker/.env << 'EOF'
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.${{ env.DOMAIN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://chat.${{ env.DOMAIN }}
            PORT=4000
            NODE_ENV=production
            API_BASE_URL=https://chat-api.${{ env.DOMAIN }}
            FRONTEND_URL=https://chat.${{ env.DOMAIN }}
            DOMAIN=${{ env.DOMAIN }}
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
            LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            METRICS_TOKEN=${{ secrets.METRICS_TOKEN }}
            CHAT_NTFY_URL=https://ntfy.mainecybertech.us/chat-alerts
            CHAT_NTFY_USER=chat-relay
            CHAT_NTFY_PASS=${{ secrets.CHAT_NTFY_PASS }}
            EOF
            chmod 600 infra/docker/.env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            set -x

            # Aggressive disk cleanup before pulling
            echo "=== Disk usage before cleanup ==="
            df -h /
            docker system df -v

            docker compose -f infra/docker/docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            docker system prune -af
            docker builder prune -af
            docker image prune -af --filter "until=24h"

            echo "=== Disk usage after cleanup ==="
            df -h /

            ROLLBACK_SHA="${{ github.event.inputs.rollback_sha }}"
            for img in api worker web; do
              for attempt in 1 2 3; do
                if docker pull ghcr.io/${{ env.REPO_LC }}/$img:${ROLLBACK_SHA}; then
                  echo "Successfully pulled $img:${ROLLBACK_SHA}"
                  break
                fi
                echo "Attempt $attempt failed for $img:${ROLLBACK_SHA}, retrying in 5s..."
                sleep 5
              done
            done

            docker tag ghcr.io/${{ env.REPO_LC }}/api:${ROLLBACK_SHA} ghcr.io/${{ env.REPO_LC }}/api:latest
            docker tag ghcr.io/${{ env.REPO_LC }}/worker:${ROLLBACK_SHA} ghcr.io/${{ env.REPO_LC }}/worker:latest
            docker tag ghcr.io/${{ env.REPO_LC }}/web:${ROLLBACK_SHA} ghcr.io/${{ env.REPO_LC }}/web:latest

            docker compose -f infra/docker/docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -af

      - name: Health check after rollback
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.provision.outputs.api_url }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy at ${{ needs.provision.outputs.api_url }} after rollback"
              exit 0
            fi
            echo "Attempt $i: returned $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed after rollback"
          exit 1

      - name: Cleanup .env files after rollback
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          strict_host_key_checking: true
          script: |
            shred -u ${{ env.REPO_DIR }}/infra/docker/.env 2>/dev/null || true
