name: Provision + Deploy — Production
# HOTFIX PROCESS:
# 1. Create branch from main
# 2. Apply minimal fix, get PR review
# 3. Use workflow_dispatch with inputs.hotfix=true
# 4. Post hotfix notification to #operations after deploy
# 5. Schedule post-mortem within 24 hours

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "SHA to rollback to (leave empty for latest)"
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: production
  DOMAIN: mainecybertech.com
  REPO_DIR: /opt/chat

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  provision:
    name: Provision Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      droplet_ip: ${{ steps.terraform.outputs.droplet_ip }}
      frontend_url: ${{ steps.terraform.outputs.frontend_url }}
      api_url: ${{ steps.terraform.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Import existing resources
        id: import
        env:
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
        run: |
          cd infra/terraform
          DROPLET_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-${ENVIRONMENT}" '.droplets[] | select(.name==$name) | .id')
          if [ -n "$DROPLET_ID" ]; then
            echo "Importing existing droplet $DROPLET_ID"
            terraform import digitalocean_droplet.chat "$DROPLET_ID" || true
            terraform import digitalocean_firewall.chat "$DROPLET_ID" || true
          fi
          echo "exists=$([ -n "$DROPLET_ID" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "droplet_id=$DROPLET_ID" >> $GITHUB_OUTPUT

      - name: Destroy old extra droplets
        if: steps.import.outputs.exists == 'true'
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-${ENVIRONMENT}" '.droplets[] | select(.name==$name and .id!="${{ steps.import.outputs.droplet_id }}") | .id' \
            | while read OLD_ID; do
              echo "Deleting extra droplet $OLD_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID"
            done
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/firewalls?page=1&per_page=200" \
            | jq -r --arg prefix "chat-${ENVIRONMENT}" '.firewalls[] | select(.name | startswith($prefix)) | .id' \
            | while read FW_ID; do
              echo "Deleting old firewall $FW_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/firewalls/$FW_ID"
            done

      - name: Cleanup duplicate DNS records
        run: |
          ZONE_ID="${{ secrets.CF_ZONE_ID }}"
          TOKEN="${{ secrets.CF_API_TOKEN }}"
          for NAME in chat chat-api; do
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=${NAME}.${{ env.DOMAIN }}" \
              | jq -r '.result[]?.id' | while read ID; do
                echo "Deleting old DNS record $NAME (id=$ID)"
                curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID"
              done
          done

      - name: Terraform Apply
        id: terraform
        working-directory: infra/terraform
        env:
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_ssh_allowed_ips: ${{ secrets.SSH_ALLOWED_IPS }}
        run: |
          terraform apply -auto-approve -input=false
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> $GITHUB_OUTPUT
          echo "frontend_url=https://chat.${{ env.DOMAIN }}" >> $GITHUB_OUTPUT
          echo "api_url=https://chat-api.${{ env.DOMAIN }}" >> $GITHUB_OUTPUT

  build-images:
    name: Build and Push Images
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:latest
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/worker:latest
            ghcr.io/${{ env.REPO_LC }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.mainecybertech.com
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.com
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.run_started_at }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:latest
            ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: [build-images, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "${{ env.REPO_DIR }}" ]; then
              git clone https://github.com/${{ github.repository }}.git ${{ env.REPO_DIR }}
            fi
            cd ${{ env.REPO_DIR }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            set +x
            cat > infra/docker/.env << 'EOF'
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.${{ env.DOMAIN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://chat.${{ env.DOMAIN }}
            PORT=4000
            NODE_ENV=production
            API_BASE_URL=https://chat-api.${{ env.DOMAIN }}
            FRONTEND_URL=https://chat.${{ env.DOMAIN }}
            DOMAIN=${{ env.DOMAIN }}
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
            LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            EOF
            CERT_DIR=/opt/chat/infra/docker/certs
            mkdir -p "$CERT_DIR"
            echo "${{ secrets.CF_ORIGIN_CERT }}" > "$CERT_DIR/fullchain.pem"
            echo "${{ secrets.CF_ORIGIN_KEY }}" > "$CERT_DIR/privkey.pem"
            chmod 600 "$CERT_DIR/privkey.pem"
            set -x
            mkdir -p /opt/chat/caddy-data /opt/chat/caddy-config

      - name: Deploy containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: |
            cd ${{ env.REPO_DIR }}

            exec 200>/tmp/chat-deploy.lock
            flock -n 200 || { echo "Deploy already in progress (locked by /tmp/chat-deploy.lock)"; exit 1; }

            set +x
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            set -x

            # Aggressive disk cleanup before pulling
            echo "=== Disk usage before cleanup ==="
            df -h /
            docker system df -v

            # Stop and remove all containers first
            docker compose -f infra/docker/docker-compose.prod.yml down -v --remove-orphans 2>/dev/null || true

            # Remove all unused images, build cache, volumes, networks
            docker system prune -af --volumes
            docker builder prune -af
            docker image prune -af --filter "until=24h"

            echo "=== Disk usage after cleanup ==="
            df -h /

            COMMIT_SHA=${{ github.sha }}

            for img in api worker web; do
              for attempt in 1 2 3; do
                if docker pull ghcr.io/${{ env.REPO_LC }}/$img:$COMMIT_SHA; then
                  docker tag ghcr.io/${{ env.REPO_LC }}/$img:$COMMIT_SHA ghcr.io/${{ env.REPO_LC }}/$img:latest
                  echo "Successfully pulled $img:$COMMIT_SHA"
                  break
                fi
                echo "Attempt $attempt failed for $img:$COMMIT_SHA, retrying in 5s..."
                sleep 5
              done
            done

            docker compose -f infra/docker/docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -af
            flock -u 200

      - name: Seed auth users via Management SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          mgmt_query() {
            RESP=$(curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1)
            echo "$RESP" | head -n -1
          }

          echo "=== Fix NULL string columns in auth.users ==="
          mgmt_query "UPDATE auth.users SET confirmation_token = COALESCE(confirmation_token, ''), recovery_token = COALESCE(recovery_token, ''), email_change_token_new = COALESCE(email_change_token_new, ''), email_change_token_current = COALESCE(email_change_token_current, ''), email_change = COALESCE(email_change, ''), phone_change = COALESCE(phone_change, ''), phone_change_token = COALESCE(phone_change_token, '') WHERE confirmation_token IS NULL OR recovery_token IS NULL OR email_change_token_new IS NULL OR email_change_token_current IS NULL"

          echo "=== Insert missing identities for seed users ==="
          mgmt_query "INSERT INTO auth.identities (id, user_id, identity_data, provider, provider_id, last_sign_in_at, created_at, updated_at) SELECT gen_random_uuid(), u.id, ('{\"email\":\"' || u.email || '\",\"sub\":\"' || u.id::text || '\",\"email_verified\":true}')::jsonb, 'email', ('email:' || u.id::text), now(), now(), now() FROM auth.users u WHERE u.email LIKE '%@seed.test' AND NOT EXISTS (SELECT 1 FROM auth.identities i WHERE i.user_id = u.id AND i.provider = 'email')"

          echo "=== Set passwords for seed users ==="
          mgmt_query "UPDATE auth.users SET encrypted_password = '\$2a\$10\$wsjrPx00aIP/IL6cbV.mM.VYl48iAag810ODhtAonKalkWBCxSf1C' WHERE email LIKE '%@seed.test'"

          echo "=== Ensure public.users entries exist ==="
          mgmt_query "INSERT INTO public.users (id, email, display_name) SELECT u.id, u.email, COALESCE(u.raw_user_meta_data->>'display_name', split_part(u.email, '@', 1)) FROM auth.users u WHERE u.email LIKE '%@seed.test' AND NOT EXISTS (SELECT 1 FROM public.users p WHERE p.id = u.id)"

          echo "=== Verification ==="
          mgmt_query "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'public_users', count(*) FROM public.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'identities', count(*) FROM auth.identities WHERE provider = 'email' AND user_id IN (SELECT id FROM auth.users WHERE email LIKE '%@seed.test')"

      - name: Seed data tables via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          cat > /tmp/split_seed.py << 'PYEOF'
          import sys, os
          filepath = sys.argv[1]
          target_kb = int(sys.argv[2]) if len(sys.argv) > 2 else 20
          target_bytes = target_kb * 1024
          with open(filepath) as f:
              content = f.read()
          lines = content.split("\n")
          chunks = []
          current = []
          current_size = 0
          for line in lines:
              current.append(line)
              current_size += len(line) + 1
              if line.strip().endswith(";") and current_size >= target_bytes:
                  chunks.append("\n".join(current))
                  current = []
                  current_size = 0
          if current:
              chunks.append("\n".join(current))
          for i, chunk in enumerate(chunks):
              outpath = f"/tmp/seed_chunk_{i:03d}.sql"
              with open(outpath, "w") as out:
                  out.write(chunk)
          print(len(chunks))
          PYEOF

          mgmt_send() {
            curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1
          }

          echo "=== Running seed files 01-05 ==="
          for f in supabase/seeds/0{1,2,3,4,5}*.sql; do
            [ -f "$f" ] || continue
            echo ""
            echo "Seeding $f..."
            SQL_SIZE=$(wc -c < "$f")
            echo "File size: ${SQL_SIZE} bytes"

            if [ "$SQL_SIZE" -gt 20000 ]; then
              echo "Splitting into chunks..."
              rm -f /tmp/seed_chunk_*.sql
              NUM_CHUNKS=$(python3 /tmp/split_seed.py "$f" 20)
              echo "Split into $NUM_CHUNKS chunks"

              SENT=0
              FAILED=0
              for chunk_file in /tmp/seed_chunk_*.sql; do
                [ -f "$chunk_file" ] || continue
                CHUNK_SQL=$(cat "$chunk_file")
                CHUNK_SIZE=${#CHUNK_SQL}
                RESP=$(mgmt_send "$CHUNK_SQL")
                HTTP_CODE=$(echo "$RESP" | tail -1)
                BODY=$(echo "$RESP" | head -n -1)
                if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - OK"
                  SENT=$((SENT + 1))
                else
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - FAIL ($HTTP_CODE)"
                  echo "  $(echo "$BODY" | head -1)"
                  FAILED=$((FAILED + 1))
                fi
              done
              rm -f /tmp/seed_chunk_*.sql
              echo "Result: $SENT OK, $FAILED failed"
            else
              RESP=$(mgmt_send "$(cat "$f")")
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | head -n -1)
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "OK ($HTTP_CODE)"
              else
                echo "FAIL ($HTTP_CODE): $(echo "$BODY" | head -3)"
              fi
            fi
          done

          echo ""
          echo "=== Final verification ==="
          RESP=$(mgmt_send "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'public_users', count(*) FROM public.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'workspaces', count(*) FROM workspaces UNION ALL SELECT 'workspace_members', count(*) FROM workspace_members UNION ALL SELECT 'channels', count(*) FROM channels UNION ALL SELECT 'channel_members', count(*) FROM channel_members UNION ALL SELECT 'messages', count(*) FROM messages UNION ALL SELECT 'thread_replies', count(*) FROM messages WHERE parent_id IS NOT NULL UNION ALL SELECT 'reactions', count(*) FROM reactions")
          echo "$RESP" | head -n -1
          echo ""
          echo "=== Seeding complete ==="

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.provision.outputs.api_url }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy at ${{ needs.provision.outputs.api_url }}"
              exit 0
            fi
            echo "Attempt $i: returned $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

  rollback:
    name: Rollback to Previous Version
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha != ''
    needs: [provision]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Rollback to SHA
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.provision.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: |
            cd ${{ env.REPO_DIR }}
            set +x
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            set -x

            # Aggressive disk cleanup before pulling
            echo "=== Disk usage before cleanup ==="
            df -h /
            docker system df -v

            docker compose -f infra/docker/docker-compose.prod.yml down -v --remove-orphans 2>/dev/null || true

            docker system prune -af --volumes
            docker builder prune -af
            docker image prune -af --filter "until=24h"

            echo "=== Disk usage after cleanup ==="
            df -h /

            ROLLBACK_SHA="${{ github.event.inputs.rollback_sha }}"
            for img in api worker web; do
              for attempt in 1 2 3; do
                if docker pull ghcr.io/${{ env.REPO_LC }}/$img:${ROLLBACK_SHA}; then
                  echo "Successfully pulled $img:${ROLLBACK_SHA}"
                  break
                fi
                echo "Attempt $attempt failed for $img:${ROLLBACK_SHA}, retrying in 5s..."
                sleep 5
              done
            done

            docker tag ghcr.io/${{ env.REPO_LC }}/api:${ROLLBACK_SHA} ghcr.io/${{ env.REPO_LC }}/api:latest
            docker tag ghcr.io/${{ env.REPO_LC }}/worker:${ROLLBACK_SHA} ghcr.io/${{ env.REPO_LC }}/worker:latest
            docker tag ghcr.io/${{ env.REPO_LC }}/web:${ROLLBACK_SHA} ghcr.io/${{ env.REPO_LC }}/web:latest

            docker compose -f infra/docker/docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -af

      - name: Health check after rollback
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ needs.provision.outputs.api_url }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy at ${{ needs.provision.outputs.api_url }} after rollback"
              exit 0
            fi
            echo "Attempt $i: returned $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed after rollback"
          exit 1
