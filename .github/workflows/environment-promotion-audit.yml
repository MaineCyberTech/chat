name: environment-promotion-audit
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment
        required: true
        type: choice
        options: [development, production]
      source_branch:
        description: Source branch name
        required: true
        type: string
jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Evaluate promotion policy
        run: |
          python scripts/audits/evaluate_promotion_gate.py --repo-root . --source-branch "${{ inputs.source_branch }}" --target-environment "${{ inputs.target_environment }}" --policy-file docs/hardening_super_bundle/policies/gate-policy.prod.json
      - name: Upload promotion gate result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-gate-result-${{ inputs.target_environment }}
          path: docs/hardening_super_bundle/examples/results/generated_promotion_gate_result.md
          if-no-files-found: warn
