name: environment-promotion-audit
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment
        required: true
        type: choice
        options: [development, production]
      source_branch:
        description: Source branch name
        required: true
        type: string
jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Evaluate promotion policy
        run: |
          python scripts/audits/evaluate_promotion_gate.py --repo-root . --source-branch "${{ inputs.source_branch }}" --target-environment "${{ inputs.target_environment }}" --policy-file docs/hardening_super_bundle/policies/gate-policy.prod.json
      - name: Upload promotion gate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-gate-result-${{ inputs.target_environment }}
          path: docs/hardening_super_bundle/examples/results/generated_promotion_gate_result.md
          if-no-files-found: warn
