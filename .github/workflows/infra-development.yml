name: Infra — Development

on:
  push:
    branches: [develop]
    paths:
      - "infra/**"
  workflow_dispatch:

concurrency:
  group: infra-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: development
  DOMAIN: mainecybertech.us

jobs:
  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      droplet_ip: ${{ steps.terraform.outputs.droplet_ip }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Cleanup duplicate droplets
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-${ENVIRONMENT}" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID"
            done

      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config="bucket=chat-terraform-state" -backend-config="endpoint=https://sfo3.digitaloceanspaces.com"

      - name: Import existing resources
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
        run: |
          # Import droplet
          DROPLET_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200")
          echo "Droplet count: $(echo "$DROPLET_JSON" | jq '.droplets | length')"
          DROPLET_ID=$(echo "$DROPLET_JSON" | jq -r --arg name "chat-${ENVIRONMENT}" '.droplets[] | select(.name==$name) | .id')
          if [ -n "$DROPLET_ID" ]; then
            echo "Importing droplet $DROPLET_ID"
            terraform import -input=false digitalocean_droplet.chat "$DROPLET_ID" || echo "Droplet import failed (may already be in state)"
          else
            echo "No existing droplet found, will create new one"
          fi
          # Import firewall if it exists (pick newest)
          FW_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/firewalls?page=1&per_page=200" \
            | jq -r --arg prefix "chat-${ENVIRONMENT}" '[.firewalls[] | select(.name | startswith($prefix))] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$FW_ID" ]; then
            echo "Importing firewall $FW_ID"
            terraform import -input=false digitalocean_firewall.chat "$FW_ID" || echo "Firewall import failed"
          fi
          # Import DNS records
          for NAME in chat chat-api; do
            RECORD_JSON=$(curl -s -H "Authorization: Bearer $TF_VAR_cloudflare_api_token" \
              "https://api.cloudflare.com/client/v4/zones/$TF_VAR_cloudflare_zone_id/dns_records?type=A&name=${NAME}.${{ env.DOMAIN }}")
            RECORD_ID=$(echo "$RECORD_JSON" | jq -r '.result[0].id // empty')
            if [ -n "$RECORD_ID" ]; then
              RESOURCE="cloudflare_dns_record.$([ "$NAME" = "chat" ] && echo "frontend" || echo "api")"
              echo "Importing DNS $NAME ($RECORD_ID) as $RESOURCE"
              terraform import -input=false "$RESOURCE" "$TF_VAR_cloudflare_zone_id/$RECORD_ID" || echo "DNS import failed"
            fi
          done

      - name: Cleanup duplicate DNS records
        run: |
          ZONE_ID="${{ secrets.CF_ZONE_ID }}"
          TOKEN="${{ secrets.CF_API_TOKEN }}"
          for NAME in chat chat-api; do
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=${NAME}.${{ env.DOMAIN }}" \
              | jq -r '.result[].id' | while read ID; do
                echo "Deleting old DNS record $NAME (id=$ID)"
                curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID"
              done
          done

      - name: Terraform Apply
        id: terraform
        timeout-minutes: 5
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_ci_public_key: ${{ secrets.CI_SSH_PUBLIC_KEY }}
          TF_VAR_ci_ssh_key_fingerprint: ${{ secrets.CI_SSH_FINGERPRINT || '' }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL || '' }}
          TF_VAR_ssh_allowed_ips: "0.0.0.0/0"
          DO_PUBKEY: ${{ secrets.CI_SSH_PUBLIC_KEY }}
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          terraform apply -auto-approve -input=false
          terraform output -raw droplet_ip > /tmp/droplet_ip
          echo "droplet_ip=$(cat /tmp/droplet_ip)" >> $GITHUB_OUTPUT
          echo "Droplet IP: $(cat /tmp/droplet_ip)"

      - name: Health check — wait for SSH
        run: |
          IP="${{ steps.terraform.outputs.droplet_ip }}"
          echo "Waiting for SSH on $IP..."
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/ssh_key root@$IP "echo ready" 2>/dev/null; then
              echo "SSH ready after $((i * 10))s"
              rm -f /tmp/ssh_key
              exit 0
            fi
            echo "Attempt $i: SSH not ready, retrying in 10s..."
            sleep 10
          done
          rm -f /tmp/ssh_key
          echo "SSH never became available"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droplet-ip
          path: /tmp/droplet_ip
