name: Infra — Development

on:
  push:
    branches: [develop]
    paths:
      - "infra/**"
  workflow_dispatch:

env:
  ENVIRONMENT: development
  DOMAIN: mainecybertech.us

jobs:
  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      droplet_ip: ${{ steps.terraform.outputs.droplet_ip }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Import existing resources
        id: import
        env:
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
        run: |
          cd infra/terraform
          DROPLET_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-${ENVIRONMENT}" '.droplets[] | select(.name==$name) | .id')
          if [ -n "$DROPLET_ID" ]; then
            echo "Importing existing droplet $DROPLET_ID"
            terraform import digitalocean_droplet.chat "$DROPLET_ID" || true
          fi

      - name: Cleanup old firewalls
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/firewalls?page=1&per_page=200" \
            | jq -r --arg prefix "chat-${ENVIRONMENT}" '.firewalls[] | select(.name | startswith($prefix)) | .id' \
            | while read FW_ID; do
              echo "Deleting old firewall $FW_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/firewalls/$FW_ID"
            done

      - name: Cleanup duplicate DNS records
        run: |
          ZONE_ID="${{ secrets.CF_ZONE_ID }}"
          TOKEN="${{ secrets.CF_API_TOKEN }}"
          for NAME in chat chat-api; do
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=${NAME}.${DOMAIN}" \
              | jq -r '.result[]?.id' | while read ID; do
                echo "Deleting old DNS record $NAME (id=$ID)"
                curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID"
              done
          done

      - name: Terraform Apply
        id: terraform
        working-directory: infra/terraform
        env:
          TF_VAR_do_token: ${{ secrets.DO_API_TOKEN }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_domain: ${{ env.DOMAIN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          DO_PUBKEY: ${{ secrets.CI_SSH_PUBLIC_KEY }}
          DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          if [ -n "$DO_PUBKEY" ]; then
            FINGERPRINT=$(ssh-keygen -lf /dev/stdin <<< "$DO_PUBKEY" | awk '{print $2}')
            EXISTS=$(curl -s -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/account/keys?fingerprint=$FINGERPRINT" \
              | jq -r '.ssh_keys[0].id // empty')
            if [ -z "$EXISTS" ]; then
              echo "Registering CI SSH key with DigitalOcean"
              curl -s -X POST -H "Authorization: Bearer $DO_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg pk "$DO_PUBKEY" --arg name "ci-chat" '{name:$name,public_key:$pk}')" \
                "https://api.digitalocean.com/v2/account/keys" > /dev/null
            fi
          fi
          terraform apply -auto-approve -input=false
          terraform output -raw droplet_ip > /tmp/droplet_ip
          echo "droplet_ip=$(cat /tmp/droplet_ip)" >> $GITHUB_OUTPUT
          echo "Droplet IP: $(cat /tmp/droplet_ip)"

      - name: Health check — wait for SSH
        run: |
          IP="${{ steps.terraform.outputs.droplet_ip }}"
          echo "Waiting for SSH on $IP..."
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/ssh_key root@$IP "echo ready" 2>/dev/null; then
              echo "SSH ready after $((i * 10))s"
              rm -f /tmp/ssh_key
              exit 0
            fi
            echo "Attempt $i: SSH not ready, retrying in 10s..."
            sleep 10
          done
          rm -f /tmp/ssh_key
          echo "SSH never became available"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droplet-ip
          path: /tmp/droplet_ip
