name: Validate

on:
  workflow_call:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Run tests with coverage and JUnit output
        run: pnpm vitest run --config vitest.config.ts --coverage --reporter default --reporter junit --outputFile test-results/junit.xml
      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  diff-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run diff coverage
        run: |
          pnpm test -- --changed --coverage --reporter=json --coverage.reporter=json-summary
      - name: Upload diff coverage report
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage
          path: coverage/
      - name: Check diff coverage thresholds
        run: |
          node -e "
          const fs = require('fs');
          const coveragePath = './coverage/coverage-summary.json';
          if (!fs.existsSync(coveragePath)) {
            console.log('No coverage summary found, skipping threshold check');
            process.exit(0);
          }
          const summary = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
          const total = summary.total;
          const required = { lines: 40, functions: 30, branches: 30, statements: 40 };
          let failures = [];
          for (const [key, threshold] of Object.entries(required)) {
            const actual = total[key]?.pct ?? 0;
            if (actual < threshold) {
              failures.push(`${key}: ${actual}% < ${threshold}%`);
            }
          }
          if (failures.length > 0) {
            console.error('Coverage thresholds not met:', failures.join(', '));
            process.exit(1);
          }
          console.log('All coverage thresholds met');
          "

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  branch-protection:
    name: Check Branch Protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == github.actor || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch protection on main
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });

            const required = [
              'required_status_checks',
              'enforce_admins',
              'required_pull_request_reviews',
              'restrictions'
            ];

            const missing = required.filter(r => !branch.data[r]);

            if (missing.length > 0) {
              console.log('❌ Missing branch protection rules:', missing.join(', '));
              core.setFailed(`Branch protection not fully configured. Missing: ${missing.join(', ')}`);
              process.exit(1);
            } else {
              console.log('✅ All branch protection rules configured');
            }

  migration-test:
    name: Test Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.108.0"

      - name: Start Supabase local
        run: supabase start

      - name: Dry-run migrations (catch SQL errors early)
        run: |
          supabase db diff --schema public --dry-run || true

      - name: Apply migrations
        run: supabase db reset

      - name: Verify migration status
        run: supabase migration list || echo "Migration list not available (project not linked), skipping verification"

      - name: Validate migration order
        run: |
          prev=""
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            v=$(basename "$f" | cut -d_ -f1)
            if [ -n "$prev" ] && [ "$v" \< "$prev" ] 2>/dev/null; then
              echo "❌ Migration ordering error: $v < $prev"
              exit 1
            fi
            prev="$v"
          done
          echo "✅ Migration order validated"

      - name: Run SQL lint
        run: |
          supabase db lint --level warning || echo "Lint warnings found (non-blocking)"

      - name: Run database tests (if any)
        run: |
          # Run any SQL-based tests
          if [ -d "./supabase/tests" ]; then
            for test in ./supabase/tests/*.sql; do
              echo "Running $test..."
              supabase db execute --file "$test" || exit 1
            done
          else
            echo "No SQL tests found, skipping"
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test, security-audit, migration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Install Supabase CLI
        continue-on-error: true
        run: npm install -g supabase
      - name: Start Supabase local
        continue-on-error: true
        run: supabase start
      - name: Run migrations
        continue-on-error: true
        run: supabase db reset
      - name: Seed test data
        continue-on-error: true
        run: supabase db execute --file supabase/seeds/seed.sql
      - name: Run E2E tests
        run: pnpm test:e2e
