name: Validate

on:
  workflow_call:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Run tests with coverage, JUnit output, and flaky test retry
        run: pnpm vitest run --config vitest.config.ts --retry=1 --coverage --reporter default --reporter junit --outputFile test-results/junit.xml
      - name: Check for flaky tests
        if: failure()
        run: |
          if [ -f test-results/junit.xml ]; then
            FLAKY=$(grep -c 'flaky="true"' test-results/junit.xml 2>/dev/null || true)
            if [ "$FLAKY" -gt 0 ]; then
              echo "⚠️ $FLAKY flaky test(s) detected. Review test-results/junit.xml for details."
            fi
          fi
      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: test-results/
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/

  diff-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run diff coverage
        run: |
          pnpm test -- --changed --coverage --reporter=json --coverage.reporter=json-summary
      - name: Upload diff coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diff-coverage
          path: coverage/
      - name: Check diff coverage thresholds (blocking)
        run: |
          node -e "
          const fs = require('fs');
          const coveragePath = './coverage/coverage-summary.json';
          if (!fs.existsSync(coveragePath)) {
            console.log('No coverage summary found, skipping threshold check');
            process.exit(0);
          }
          const summary = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
          const total = summary.total;
          const required = { lines: 20, functions: 20, branches: 15, statements: 20 };
          let failures = [];
          for (const [key, threshold] of Object.entries(required)) {
            const actual = total[key]?.pct ?? 0;
            if (actual < threshold) {
              failures.push(`${key}: ${actual}% < ${threshold}%`);
            }
          }
          if (failures.length > 0) {
            console.error('Coverage thresholds not met:', failures.join(', '));
            process.exit(1);
          }
          console.log('All coverage thresholds met');
          "

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  openapi-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate OpenAPI spec
        run: |
          node -e "
          const fs = require('fs');
          const specPath = 'docs/api/openapi.json';
          if (!fs.existsSync(specPath)) {
            console.error('OpenAPI spec not found at ' + specPath);
            process.exit(1);
          }
          const content = fs.readFileSync(specPath, 'utf8');
          let spec;
          try { spec = JSON.parse(content); } catch (e) {
            console.error('Invalid JSON in OpenAPI spec:', e.message);
            process.exit(1);
          }
          const required = ['openapi', 'info', 'paths'];
          const missing = required.filter((k) => !spec[k]);
          if (missing.length) {
            console.error('Missing required fields:', missing.join(', '));
            process.exit(1);
          }
          if (!spec.info.title || !spec.info.version) {
            console.error('OpenAPI info must have title and version');
            process.exit(1);
          }
          if (!spec.paths || !Object.keys(spec.paths).length) {
            console.error('OpenAPI spec must define at least one path');
            process.exit(1);
          }
          console.log('OpenAPI spec is valid');
          "

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (blocking; time-boxed exceptions)
        # Blocking: fail on any HIGH/CRITICAL advisory not in .pnpm-audit-exceptions.json,
        # and on the entire exception list once it expires. Do not restore `|| true`.
        run: |
          set -euo pipefail
          corepack pnpm audit --prod --json > audit.json 2>/dev/null || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const exceptions = JSON.parse(fs.readFileSync('.pnpm-audit-exceptions.json', 'utf8'));
          const expiry = Date.parse(`${exceptions.expires}T23:59:59Z`);
          if (Number.isNaN(expiry) || Date.now() > expiry) {
            console.error(`audit exceptions expired on ${exceptions.expires}; renew or fix the listed advisories`);
            process.exit(1);
          }
          const allow = new Set(exceptions.ignoreGhsas || []);
          const blocking = [];
          for (const adv of Object.values(report.advisories || {})) {
            if (adv.severity !== 'high' && adv.severity !== 'critical') continue;
            const id = adv.github_advisory_id || `npm-${adv.id}`;
            if (!allow.has(id)) blocking.push(`${adv.severity} ${id} ${adv.module_name}: ${adv.title}`);
          }
          if (blocking.length) {
            console.error('Un-allowlisted HIGH/CRITICAL advisories:\n' + blocking.join('\n'));
            process.exit(1);
          }
          console.log(`pnpm audit: no HIGH/CRITICAL advisories outside the ${allow.size}-entry time-boxed exception list`);
          NODE
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          # Blocking: exit non-zero on HIGH/CRITICAL findings. Time-boxed exceptions belong
          # in .trivyignore at the repo root.
          exit-code: "1"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  branch-protection:
    name: Check Branch Protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Blocking, not advisory. `main` must carry active rules requiring PR review,
    # passing status checks, and no force pushes. This is the in-repo gate for the
    # governance findings CI-P1-001 / CI-P2-007: a misconfigured `main` fails CI
    # instead of silently reporting a false sense of protection.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check branch rules on main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'main';

            // GET /repos/{owner}/{repo}/rules/branches/{branch} returns every active
            // rule applying to the branch, whether configured as a repository ruleset
            // or as a classic branch protection rule. The legacy getBranchProtection
            // endpoint 404s when protection is expressed as a ruleset and misreports
            // the optional `restrictions` field, so it is not used here.
            let rules;
            try {
              rules = await github.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner,
                repo,
                branch,
                per_page: 100
              });
            } catch (error) {
              core.setFailed(`Unable to read branch rules for '${branch}': ${error.message}`);
              return;
            }

            const types = new Set(rules.map(rule => rule.type));
            const required = {
              pull_request: 'require pull request reviews before merging',
              required_status_checks: 'require status checks to pass before merging',
              non_fast_forward: 'block force pushes'
            };

            const missing = Object.entries(required)
              .filter(([type]) => !types.has(type))
              .map(([, description]) => description);

            if (missing.length > 0) {
              core.setFailed(`Branch rules for '${branch}' are incomplete. Missing: ${missing.join('; ')}`);
              return;
            }
            core.info(`Branch rules for '${branch}' satisfy the required gates: ${[...types].sort().join(', ')}`);

  migration-test:
    name: Test Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: "2.108.0"

      - name: Start Supabase local
        run: supabase start

      - name: Dry-run migrations (catch SQL errors early)
        run: supabase db diff --schema public

      - name: Apply migrations
        run: supabase db reset

      - name: Verify migration status
        run: supabase migration list || echo "Migration list not available (project not linked), skipping verification"

      - name: Validate migration order (blocking)
        run: |
          MANIFEST="supabase/migrations/migrations.list"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Migration manifest not found at $MANIFEST"
            exit 1
          fi
          # Compare filesystem order with the manifest.
          actual=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | sort | tr -d '\r')
          expected=$(sort "$MANIFEST" | tr -d '\r')
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: Migration order mismatch"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "✅ Migration order matches manifest"

      - name: Run SQL lint
        run: |
          supabase db lint --level error

      - name: Run real-database RLS integration tests (blocking)
        run: |
          # Execute every SQL test against the real local Postgres, so RLS and
          # tenant-isolation regressions fail CI (closes TEST-P2-003).
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "ERROR: local Supabase database container not found"
            exit 1
          fi
          shopt -s nullglob
          tests=(supabase/tests/*.sql)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "ERROR: no SQL tests found under supabase/tests/"
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "Running $test..."
            docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$test"
          done

      - name: Test migration rollback (execute downs in reverse, then re-apply ups)
        run: |
          set -euo pipefail
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          if [ -z "$DB_URL" ]; then
            echo "ERROR: could not determine local database URL"
            exit 1
          fi

          # 1. Require a down script for every migration.
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f" .sql)
            down="supabase/rollback/${base}_down.sql"
            if [ ! -f "$down" ]; then
              echo "ERROR: Missing rollback for $base"
              exit 1
            fi
          done
          echo "✅ All migrations have matching rollback scripts"

          # 2. Actually execute the down scripts in reverse order.
          failures=0
          count=0
          while IFS= read -r down; do
            echo "Applying rollback: $down"
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$down"; then
              echo "ERROR: rollback failed: $down"
              failures=$((failures + 1))
            fi
            count=$((count + 1))
          done < <(find supabase/rollback -name '*_down.sql' | sort -r)
          echo "Executed $count rollback script(s), $failures failure(s)"
          if [ "$failures" -ne 0 ]; then
            echo "ERROR: migration rollback is not clean; see failures above"
            exit 1
          fi

          # 3. Re-apply all migrations to prove the up/down/up round-trip.
          supabase db reset
          echo "✅ Migration up/down/up round-trip succeeded"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test, security-audit, migration-test, openapi-validate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        # Blocking E2E needs a launchable browser: install Chromium plus its OS libraries.
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Start Supabase local
        run: supabase start
      - name: Run migrations and seed data (blocking)
        # `supabase db reset` applies the migrations and then [db.seed].sql_paths
        # (supabase/seeds/*.sql) from config.toml. The previous separate seed step
        # referenced a non-existent supabase/seeds/seed.sql and silently did nothing.
        run: supabase db reset
      - name: Provision E2E credentials
        # Blocking + self-provisioning: generate the test-signin.json the suite reads from
        # the local seed user below, instead of depending on a committed credential file.
        # These are local-only seed credentials (documented in supabase/seeds/00_*.sql), not secrets.
        run: |
          printf '{\n  "email": "marcus@seed.test",\n  "password": "password123"\n}\n' > test-signin.json
      - name: Run E2E tests
        timeout-minutes: 10
        run: pnpm test:e2e 2>&1
