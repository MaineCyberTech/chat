name: Apply Migrations

# Applies pending migrations to the self-hosted PostgreSQL in the lab LXC.
#
# Previously this ran `supabase link` + `supabase db push --include-all` against
# the hosted project. Schema now lives on our own Postgres, so this delegates to
# the same self-hosted path the Seed Database workflow uses (schema only; pass
# seeds explicitly from that workflow).
#
# Migrations are tracked in `public.schema_migrations`, so this is a no-op when
# nothing is pending.

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/bootstrap/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    uses: ./.github/workflows/seed-database.yml
    secrets: inherit
    with:
      include_seeds: false
      reset: false
