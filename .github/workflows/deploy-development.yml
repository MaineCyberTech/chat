name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/docker/**"
      - ".github/workflows/deploy-development.yml"

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Resolve droplet IP
        id: ip
        run: |
          set -e
          DO_TOKEN="${{ secrets.DO_API_TOKEN }}"
          ALL_DROPLETS=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200")
          echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -sf -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID" || true
            done
          IP=$(echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | last | .networks.v4[0].ip_address // empty')
          if [ -z "$IP" ]; then
            echo "ERROR: No chat-development droplet found. Droplets:"
            echo "$ALL_DROPLETS" | jq '[.droplets[] | {name, ip: .networks.v4[0].ip_address, created: .created_at}]'
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Wait for SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: echo "SSH ready"
          timeout: 60s

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
            CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
            CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
            CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
            CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
            VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
            REPO_DIR: /opt/chat
            REPO_LC: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          script: |
            set -e
            echo "=== SSH pre-flight ==="
            echo "ALIVE_$(date +%s)"

            echo "=== Writing env file ==="
            cat > ${REPO_DIR}/.env << 'ENVEOF'
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us
            NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            NODE_ENV=development
            API_BASE_URL=https://chat-api.mainecybertech.us
            FRONTEND_URL=https://chat.mainecybertech.us
            VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
            VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
            ENVEOF

            echo "=== Droplet setup ==="
            cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2
            fi
            mkdir -p ${REPO_DIR}
            mkdir -p ${REPO_DIR}/certs
            if [ ! -f ${REPO_DIR}/certs/fullchain.pem ]; then
              apk add --no-cache openssl 2>/dev/null || apt-get install -y -qq openssl
              openssl req -x509 -newkey rsa:2048 -keyout ${REPO_DIR}/certs/privkey.pem -out ${REPO_DIR}/certs/fullchain.pem -days 3650 -nodes -subj "/CN=*.mainecybertech.us/O=Chat Platform" 2>/dev/null
            fi
            for i in $(seq 1 12); do docker info >/dev/null 2>&1 && break; echo 'Waiting for Docker...'; sleep 10; done
            if [ ! -f /swapfile ]; then
              fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            fi
            docker stop $(docker ps -q) 2>/dev/null || true
            docker rm -f $(docker ps -aq) 2>/dev/null || true
            docker network prune -f 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            fuser -k 80/tcp 2>/dev/null || true
            df -h /

            echo "=== Transferring compose file ==="
            cat > ${REPO_DIR}/docker-compose.yml << 'COMPOSEEOF'
            $(base64 -w0 infra/docker/docker-compose.devremote.yml)
            COMPOSEEOF
            base64 -d <<< "$(cat ${REPO_DIR}/docker-compose.yml)" > ${REPO_DIR}/docker-compose.yml

            echo "=== Transferring Caddyfile ==="
            cat > ${REPO_DIR}/Caddyfile << 'CADDYEOF'
            $(base64 -w0 infra/docker/Caddyfile)
            CADDYEOF
            base64 -d <<< "$(cat ${REPO_DIR}/Caddyfile)" > ${REPO_DIR}/Caddyfile

            echo "=== Transferring TLS certs ==="
            if [ -n "${CF_ORIGIN_CERT}" ]; then
              mkdir -p ${REPO_DIR}/certs
              echo "${CF_ORIGIN_CERT}" > ${REPO_DIR}/certs/fullchain.pem
              echo "${CF_ORIGIN_KEY}" > ${REPO_DIR}/certs/privkey.pem
              chmod 600 ${REPO_DIR}/certs/privkey.pem ${REPO_DIR}/certs/fullchain.pem
            else
              echo "CF_ORIGIN_CERT secret not set — using self-signed certs"
            fi

            echo "=== Piping images ==="
            for IMG in api web; do
              IMG_TAG=dev
              echo "--- PIPING $IMG IMAGE ---"
              # Try docker pull first as fallback, then pipe if pull fails
              docker pull ghcr.io/${REPO_LC}/$IMG:$IMG_TAG 2>&1 && {
                echo "Pull successful for $IMG, skipping pipe"
              } || {
                echo "Pull failed, piping image for $IMG"
                docker save ghcr.io/${REPO_LC}/$IMG:$IMG_TAG | gzip | gunzip | docker load
              }
            done

            echo "=== Starting services ==="
            cd ${REPO_DIR}
            sleep 2
            docker compose -f docker-compose.yml up -d --remove-orphans
            sleep 5

            echo "=== Health check ==="
            i=1
            while [ $i -le 12 ]; do
              if docker compose -f docker-compose.yml ps --format json | grep -q '"State":"running"'; then
                echo "ALL HEALTHY"
                docker image prune -af
                exit 0
              fi
              echo "Attempt $i: waiting for API..."
              sleep 10
              i=$((i + 1))
            done
            echo "FAILED: Services did not become healthy"
            docker compose -f docker-compose.yml logs --tail 50
            exit 1

      - name: Health check
        run: |
          echo "=== External health check ==="
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://chat-api.mainecybertech.us/healthz 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTP)"
              exit 0
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chat-api.mainecybertech.us/healthz --connect-timeout 5 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTPS)"
              exit 0
            fi
            echo "External attempt $i: HTTP=$STATUS, retrying..."
            sleep 5
          done
          echo "External health check failed — likely DNS or cert still provisioning."
          echo "Internal health check passed on droplet. Caddy may still be retrying certs."
          exit 0
