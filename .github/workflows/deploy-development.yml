name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/docker/**"
      - ".github/workflows/deploy-development.yml"

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Resolve droplet IP
        id: ip
        run: |
          set -e
          DO_TOKEN="${{ secrets.DO_API_TOKEN }}"
          ALL_DROPLETS=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200")
          echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -sf -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID" || true
            done
          IP=$(echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | last | .networks.v4[0].ip_address // empty')
          if [ -z "$IP" ]; then
            echo "ERROR: No chat-development droplet found. Droplets:"
            echo "$ALL_DROPLETS" | jq '[.droplets[] | {name, ip: .networks.v4[0].ip_address, created: .created_at}]'
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Wait for SSH
        run: |
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          IP="${{ steps.ip.outputs.droplet_ip }}"
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/ssh_key root@$IP "echo ready" 2>/dev/null; then
              echo "SSH ready after $((i * 10))s"
              exit 0
            fi
            echo "Attempt $i: not ready, retrying in 10s..."
            sleep 10
          done
          echo "SSH never became available"
          exit 1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          IP="${{ steps.ip.outputs.droplet_ip }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10"

          echo "=== SSH pre-flight ==="
          ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "echo ALIVE_$(date +%s)" 2>&1
          echo "SSH_TEST_EXIT=$?"

          echo "=== Writing env file ==="
          echo "SUPABASE_URL=${SUPABASE_URL}" > /tmp/.env.devremote
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> /tmp/.env.devremote
          echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" >> /tmp/.env.devremote
          echo "NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us" >> /tmp/.env.devremote
          echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" >> /tmp/.env.devremote
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> /tmp/.env.devremote
          echo "NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us" >> /tmp/.env.devremote
          echo "NODE_ENV=development" >> /tmp/.env.devremote
          echo "API_BASE_URL=https://chat-api.mainecybertech.us" >> /tmp/.env.devremote
          echo "FRONTEND_URL=https://chat.mainecybertech.us" >> /tmp/.env.devremote

          echo "=== Transferring env file ==="
          base64 -w0 /tmp/.env.devremote | ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "base64 -d > ${REPO_DIR}/.env"
          echo "ENV_EXIT=$?"

          echo "=== Droplet setup ==="
          ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "
            cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2
            fi
            mkdir -p ${REPO_DIR}
            for i in \$(seq 1 12); do docker info >/dev/null 2>&1 && break; echo 'Waiting for Docker...'; sleep 10; done
            if [ ! -f /swapfile ]; then
              fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            fi
            docker stop \$(docker ps -q) 2>/dev/null || true
            docker rm -f \$(docker ps -aq) 2>/dev/null || true
            docker network prune -f 2>/dev/null || true
            docker system prune -af --volumes 2>/dev/null || true
            fuser -k 80/tcp 2>/dev/null || true
            df -h /
          "
          echo "SETUP_EXIT=$?"

          echo "=== Transferring compose file ==="
          base64 -w0 infra/docker/docker-compose.devremote.yml | ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "base64 -d > ${REPO_DIR}/docker-compose.yml"
          echo "COMPOSE_EXIT=$?"

          echo "=== Transferring Caddyfile ==="
          base64 -w0 infra/docker/Caddyfile | ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "base64 -d > ${REPO_DIR}/Caddyfile"
          echo "CADDY_EXIT=$?"

          echo "=== Piping images ==="
          for IMG in api web; do
            IMG_TAG=dev
            echo "--- PIPING $IMG IMAGE ---"
            REPO_LC="${GITHUB_REPOSITORY,,}"
            echo "REPO_LC=$REPO_LC"
            docker pull ghcr.io/$REPO_LC/$IMG:$IMG_TAG
            docker save ghcr.io/$REPO_LC/$IMG:$IMG_TAG | gzip | ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "gunzip | docker load" 2>&1
            echo "PIPE_${IMG^^}_EXIT=$?"
          done

          echo "=== Starting services ==="
          ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "
            cd ${REPO_DIR}
            sleep 2
            docker compose -f docker-compose.yml up -d --remove-orphans
            sleep 5
          "
          echo "COMPOSE_UP_EXIT=$?"

          echo "=== Health check ==="
          cat > /tmp/health.sh << 'CHECKEOF'
          #!/bin/bash
          cd /opt/chat
          i=1
          while [ $i -le 12 ]; do
            if docker compose -f docker-compose.yml ps --format json | grep -q '"State":"running"'; then
              echo "ALL HEALTHY"
              docker image prune -af
              exit 0
            fi
            echo "Attempt $i: waiting for API..."
            sleep 10
            i=$((i + 1))
          done
          echo "FAILED: Services did not become healthy"
          docker compose -f docker-compose.yml logs --tail 50
          exit 1
          CHECKEOF
          base64 -w0 /tmp/health.sh | ssh $SSH_OPTS -i /tmp/ssh_key root@$IP "base64 -d > /tmp/health.sh && chmod +x /tmp/health.sh && bash /tmp/health.sh"

          rm -f /tmp/ssh_key

      - name: Health check
        run: |
          echo "=== External health check ==="
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://chat-api.mainecybertech.us/healthz 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTP)"
              exit 0
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chat-api.mainecybertech.us/healthz --connect-timeout 5 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTPS)"
              exit 0
            fi
            echo "External attempt $i: HTTP=$STATUS, retrying..."
            sleep 5
          done
          echo "External health check failed — likely DNS or cert still provisioning."
          echo "Internal health check passed on droplet. Caddy may still be retrying certs."
          exit 0
