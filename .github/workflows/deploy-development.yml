name: Deploy to Lab LXC

# Deploys to the self-hosted stack running in the `chat-dev` LXC on the Proxmox
# node `testnuc`. Replaces the previous DigitalOcean droplet target.
#
# Schema changes are NOT applied here: deploys ship application images only. See
# docs/operations/database-change-governance.md, and use
# `scripts/db/apply-migrations.mjs` (or the Seed Database workflow) for schema
# and data. See docs/runbooks/lab-lxc-environment.md.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "supabase/migrations/**"
      - "infra/docker/docker-compose.devremote.yml"
      - ".github/workflows/deploy-development.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: development
  REPO_DIR: /opt/chat
  # Override with a repository variable if the LXC moves.
  LAB_HOST: ${{ vars.LAB_LXC_HOST || '192.168.222.240' }}
  LAB_URL: ${{ vars.LAB_LXC_URL || 'http://192.168.222.240' }}

jobs:
  deploy:
    name: Deploy
    # Docker is required by the appleboy/* actions; `lab-docker` guarantees it.
    runs-on: [self-hosted, linux, x64, lab-docker]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Wait for CI to complete
        run: |
          set -e
          echo "Waiting for CI workflow for commit ${{ github.sha }}..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              | jq -r '.workflow_runs[0].conclusion // "null"')
            if [ "$STATUS" = "success" ] || [ "$STATUS" = "cancelled" ]; then
              echo "CI completed (status: $STATUS)."
              exit 0
            elif [ "$STATUS" = "failure" ]; then
              echo "ERROR: CI failed for ${{ github.sha }}"
              exit 1
            fi
            echo "Attempt $i/60 - CI status: $STATUS"
            sleep 15
          done
          echo "ERROR: Timed out waiting for CI"
          exit 1

      - name: Wait for build-push to complete
        run: |
          set -e
          echo "Waiting for build-push workflow for commit ${{ github.sha }}..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-push.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              | jq -r '.workflow_runs[0].conclusion // "null"')
            if [ "$STATUS" = "success" ]; then
              echo "Build-push completed successfully."
              exit 0
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
              echo "ERROR: build-push failed with status: $STATUS"
              exit 1
            fi
            echo "Attempt $i/60 - build-push status: $STATUS"
            sleep 15
          done
          echo "ERROR: Timed out waiting for build-push"
          exit 1

      - name: Verify the target is reachable
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.LAB_HOST }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            hostname
            docker --version
            docker compose version
            if [ ! -f "${{ env.REPO_DIR }}/infra/docker/.env" ]; then
              echo "ERROR: ${{ env.REPO_DIR }}/infra/docker/.env is missing."
              echo "This file holds the deployment secrets and is managed out of band."
              echo "See docs/runbooks/lab-lxc-environment.md."
              exit 1
            fi
            echo "target ready"

      - name: Sync compose file
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ env.LAB_HOST }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          source: "infra/docker/docker-compose.devremote.yml"
          target: "${{ env.REPO_DIR }}"
          # The site-specific Caddyfile and .env are deliberately NOT synced:
          # they are environment config, not build artefacts.

      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.LAB_HOST }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            set +x
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            set -x

            echo "=== disk before ==="
            df -h / | tail -1

            # Pull by commit SHA first (race-safe), falling back to :dev.
            COMMIT_SHA=${{ github.sha }}
            for img in api worker web; do
              if docker pull "ghcr.io/${{ env.REPO_LC }}/$img:$COMMIT_SHA"; then
                docker tag "ghcr.io/${{ env.REPO_LC }}/$img:$COMMIT_SHA" "ghcr.io/${{ env.REPO_LC }}/$img:dev"
                echo "pulled $img:$COMMIT_SHA"
              else
                for attempt in 1 2 3; do
                  if docker pull "ghcr.io/${{ env.REPO_LC }}/$img:dev"; then
                    echo "pulled $img:dev (fallback)"
                    break
                  fi
                  echo "attempt $attempt failed for $img:dev; retrying"
                  sleep 5
                done
              fi
            done

            docker compose -f infra/docker/docker-compose.devremote.yml up -d --force-recreate --remove-orphans

            # Never prune volumes here: it destroyed the Redis AOF historically.
            docker image prune -af --filter "until=24h" >/dev/null 2>&1 || true

            echo "=== waiting for health ==="
            for i in $(seq 1 36); do
              LOGS=$(docker compose -f infra/docker/docker-compose.devremote.yml ps 2>&1)
              if echo "$LOGS" | grep -q "Exit "; then
                echo "ERROR: a container exited"
                docker compose -f infra/docker/docker-compose.devremote.yml logs --tail 100
                exit 1
              fi
              API_HEALTHY=$(echo "$LOGS" | grep -c "(healthy)" || true)
              if [ "$API_HEALTHY" -ge 3 ]; then
                echo "$LOGS"
                exit 0
              fi
              echo "waiting for containers to become healthy ($i/36)"
              sleep 10
            done
            echo "ERROR: containers did not become healthy"
            docker compose -f infra/docker/docker-compose.devremote.yml ps
            exit 1

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            API=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "${{ env.LAB_URL }}/health" || echo 000)
            WEB=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "${{ env.LAB_URL }}/" || echo 000)
            if [ "$API" = "200" ] && [ "$WEB" = "200" ]; then
              echo "API and web are healthy at ${{ env.LAB_URL }}"
              exit 0
            fi
            echo "attempt $i: api=$API web=$WEB"
            sleep 10
          done
          echo "ERROR: health check failed"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to lab LXC"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`${{ env.LAB_HOST }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| URL | ${{ env.LAB_URL }} |"
          } >> "$GITHUB_STEP_SUMMARY"
