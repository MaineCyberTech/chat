name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Resolve droplet IP
        id: ip
        run: |
          set -e
          DO_TOKEN="${{ secrets.DO_API_TOKEN }}"
          ALL_DROPLETS=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200")
          echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -sf -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID" || true
            done
          IP=$(echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | last | .networks.v4[0].ip_address // empty')
          if [ -z "$IP" ]; then
            echo "ERROR: No chat-development droplet found. Droplets:"
            echo "$ALL_DROPLETS" | jq '[.droplets[] | {name, ip: .networks.v4[0].ip_address, created: .created_at}]'
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Wait for SSH
        run: |
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          IP="${{ steps.ip.outputs.droplet_ip }}"
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/ssh_key root@$IP "echo ready" 2>/dev/null; then
              echo "SSH ready after $((i * 10))s"
              exit 0
            fi
            echo "Attempt $i: not ready, retrying in 10s..."
            sleep 10
          done
          echo "SSH never became available"
          exit 1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          IP="${{ steps.ip.outputs.droplet_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10 -i /tmp/ssh_key root@$IP"

          echo "=== Setting up droplet ==="

          # Write env file
          $SSH "
            cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2 2>/dev/null
            fi
            mkdir -p ${REPO_DIR}
            touch ${REPO_DIR}/Caddyfile
            echo \"SUPABASE_URL=${SUPABASE_URL}\" > ${REPO_DIR}/.env.devremote
            echo \"SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}\" >> ${REPO_DIR}/.env.devremote
            echo \"SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}\" >> ${REPO_DIR}/.env.devremote
            echo 'NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us' >> ${REPO_DIR}/.env.devremote
            echo \"NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}\" >> ${REPO_DIR}/.env.devremote
            echo \"NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}\" >> ${REPO_DIR}/.env.devremote
            echo 'NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us' >> ${REPO_DIR}/.env.devremote
            echo 'PORT=4000' >> ${REPO_DIR}/.env.devremote
            echo 'NODE_ENV=development' >> ${REPO_DIR}/.env.devremote
            echo 'API_BASE_URL=https://chat-api.mainecybertech.us' >> ${REPO_DIR}/.env.devremote
            echo 'FRONTEND_URL=https://chat.mainecybertech.us' >> ${REPO_DIR}/.env.devremote
            for i in \$(seq 1 12); do docker info >/dev/null 2>&1 && break; echo 'Waiting for Docker...'; sleep 10; done
            docker image ls -q | xargs -r docker rmi -f 2>/dev/null || true
            docker system prune -af --volumes 2>/dev/null || true
          "

          echo "=== Transferring compose file ==="
          base64 -w0 infra/docker/docker-compose.devremote.yml | $SSH "base64 -d > ${REPO_DIR}/docker-compose.yml"

          echo "=== Transferring Caddyfile ==="
          base64 -w0 infra/docker/Caddyfile | $SSH "base64 -d > ${REPO_DIR}/Caddyfile"

          echo "=== Piping images ==="
          for IMG in api web; do
            docker pull ghcr.io/${{ env.REPO_LC }}/$IMG:dev
            docker save ghcr.io/${{ env.REPO_LC }}/$IMG:dev | gzip | $SSH "gunzip | docker load"
          done

          echo "=== Starting services ==="
          $SSH "
            cd ${REPO_DIR}
            # Create swap if needed for 512MB droplet
            if [ ! -f /swapfile ]; then
              fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            fi
            # Kill ALL containers
            docker stop \$(docker ps -q) 2>/dev/null || true
            docker rm -f \$(docker ps -aq) 2>/dev/null || true
            docker network prune -f 2>/dev/null || true
            # Kill anything on ports 80/443
            fuser -k 80/tcp 2>/dev/null || true
            fuser -k 443/tcp 2>/dev/null || true
            sleep 2
            docker compose -f docker-compose.yml up -d --remove-orphans
            sleep 5
          "

          echo "=== Health check ==="
          cat > /tmp/health.sh << CHECKEOF
          #!/bin/bash
          cd ${REPO_DIR}
          i=1
          while [ \$i -le 12 ]; do
            if docker compose -f docker-compose.yml ps 2>/dev/null | grep -q 'unhealthy\|restarting'; then
              echo "Unhealthy containers, retrying..."
              sleep 10
              i=\$((i + 1))
              continue
            fi
            if curl -sf http://localhost:4000/healthz >/dev/null 2>&1; then
              echo "ALL HEALTHY"
              docker image prune -af
              exit 0
            fi
            # Also try through Caddy (API port may not be exposed)
            if curl -sf http://localhost/healthz >/dev/null 2>&1; then
              echo "ALL HEALTHY (via Caddy)"
              docker image prune -af
              exit 0
            fi
            echo "Attempt \$i: waiting for API..."
            sleep 10
            i=\$((i + 1))
          done
          echo "FAILED: Services did not become healthy"
          docker compose -f docker-compose.yml logs --tail=50
          exit 1
          CHECKEOF
          base64 -w0 /tmp/health.sh | $SSH "base64 -d > /tmp/health.sh && chmod +x /tmp/health.sh && bash /tmp/health.sh"

          rm -f /tmp/ssh_key

      - name: Health check
        run: |
          echo "=== External health check ==="
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://chat-api.mainecybertech.us/healthz 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTP)"
              exit 0
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chat-api.mainecybertech.us/healthz --connect-timeout 5 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTPS)"
              exit 0
            fi
            echo "External attempt $i: HTTP=$STATUS, retrying..."
            sleep 5
          done
          echo "External health check failed — likely DNS or cert still provisioning."
          echo "Internal health check passed on droplet. Caddy may still be retrying certs."
          exit 0
