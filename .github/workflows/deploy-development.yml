name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/docker/**"
      - ".github/workflows/deploy-development.yml"

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Resolve droplet IP
        id: ip
        run: |
          set -e
          DO_TOKEN="${{ secrets.DO_API_TOKEN }}"
          ALL_DROPLETS=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200")
          echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -sf -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID" || true
            done
          IP=$(echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | last | .networks.v4[0].ip_address // empty')
          if [ -z "$IP" ]; then
            echo "ERROR: No chat-development droplet found. Droplets:"
            echo "$ALL_DROPLETS" | jq '[.droplets[] | {name, ip: .networks.v4[0].ip_address, created: .created_at}]'
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Setup droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2
            fi
            if ! git --version >/dev/null 2>&1; then
              apt-get install -y -qq git
            fi
            if [ ! -d "${{ env.REPO_DIR }}" ] || [ ! -d "${{ env.REPO_DIR }}/.git" ]; then
              rm -rf "${{ env.REPO_DIR }}"
              git clone https://github.com/${{ github.repository }}.git ${{ env.REPO_DIR }} || { echo "ERROR: git clone failed"; exit 1; }
            fi
            cd ${{ env.REPO_DIR }} && git fetch origin develop && git checkout develop && git reset --hard origin/develop

            mkdir -p ${{ env.REPO_DIR }}/certs
            if [ ! -f ${{ env.REPO_DIR }}/certs/fullchain.pem ]; then
              apt-get install -y -qq openssl
              openssl req -x509 -newkey rsa:2048 -keyout ${{ env.REPO_DIR }}/certs/privkey.pem -out ${{ env.REPO_DIR }}/certs/fullchain.pem -days 3650 -nodes -subj "/CN=*.mainecybertech.us/O=Chat Platform" 2>/dev/null
            fi
            for i in $(seq 1 12); do docker info >/dev/null 2>&1 && break; echo 'Waiting for Docker...'; sleep 10; done
            if [ ! -f /swapfile ]; then
              fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            fi

            cat > ${{ env.REPO_DIR }}/.env << EOF
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            NODE_ENV=development
            API_BASE_URL=https://chat-api.mainecybertech.us
            FRONTEND_URL=https://chat.mainecybertech.us
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            EOF

            # Also create .env in infra/docker for docker-compose
            mkdir -p ${{ env.REPO_DIR }}/infra/docker
            cp ${{ env.REPO_DIR }}/.env ${{ env.REPO_DIR }}/infra/docker/.env

            # Verify compose file exists
            if [ ! -f "infra/docker/docker-compose.devremote.yml" ]; then
              echo "ERROR: docker-compose.devremote.yml not found"
              exit 1
            fi

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/${{ env.REPO_LC }}/api:dev
            docker pull ghcr.io/${{ env.REPO_LC }}/web:dev
            docker compose -f infra/docker/docker-compose.devremote.yml up -d --remove-orphans
            docker image prune -af

            # Check API logs immediately
            echo "=== API container logs (immediate) ==="
            docker compose -f infra/docker/docker-compose.devremote.yml logs --tail 100 chat-api-dev 2>&1 || true

            # Wait a bit for container to start
            sleep 3

            # Check container status
            echo "=== Container status ==="
            docker compose -f infra/docker/docker-compose.devremote.yml ps

            # Check API logs again
            echo "=== API container logs (retry) ==="
            docker compose -f infra/docker/docker-compose.devremote.yml logs --tail 100 chat-api-dev 2>&1 || true

            # Also check docker logs directly
            echo "=== Docker logs chat-api-dev ==="
            docker logs chat-api-dev --tail 100 2>&1 || true

            # Check container details
            echo "=== Container inspect ==="
            docker inspect chat-api-dev --format='ExitCode={{.State.ExitCode}} Error={{.State.Error}} FinishedAt={{.State.FinishedAt}} OOMKilled={{.State.OOMKilled}}' 2>&1 || true

            # Get container logs via docker inspect
            echo "=== Container log path ==="
            docker inspect chat-api-dev --format='{{.LogPath}}' 2>&1 || true

            # Check container logs via cat
            echo "=== Cat container log file ==="
            LOGPATH=$(docker inspect chat-api-dev --format='{{.LogPath}}' 2>/dev/null)
            if [ -n "$LOGPATH" ] && [ -f "$LOGPATH" ]; then
              tail -100 "$LOGPATH" 2>&1 || true
            else
              echo "Log file not found or empty"
            fi

            # Check if container is actually running
            echo "=== Container state ==="
            docker inspect chat-api-dev --format='{{.State.Status}} {{.State.Running}} {{.State.Pid}} {{.State.ExitCode}}' 2>&1 || true

            # Check container logs directly
            echo "=== Docker logs chat-api-dev (full) ==="
            docker logs chat-api-dev 2>&1 || true
            
            # Run container directly to see error
            echo "=== Running container directly to see error ==="
            docker run --rm --env-file /opt/chat/.env ghcr.io/mainecybertech/chat/api:dev node dist/server.js 2>&1 > /tmp/docker-run-output.txt; echo "Exit code: $?"
            echo "MARKER: checking file size"
            ls -la /tmp/docker-run-output.txt 2>&1 || true
            echo "MARKER: cat output"
            cat /tmp/docker-run-output.txt 2>&1 || true
            echo "=== File content (wc) ==="
            wc -l /tmp/docker-run-output.txt 2>&1 || true

            # Wait for health check
            sleep 5

            # Verify services are running
            docker compose -f infra/docker/docker-compose.devremote.yml ps
            if ! docker compose -f infra/docker/docker-compose.devremote.yml ps | grep -q "Up"; then
              echo "ERROR: Services not running"
              docker compose -f infra/docker/docker-compose.devremote.yml logs --tail 50
              exit 1
            fi

      - name: Health check
        run: |
          echo "=== External health check ==="
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://chat-api.mainecybertech.us/healthz 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTP)"
              exit 0
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chat-api.mainecybertech.us/healthz --connect-timeout 5 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTPS)"
              exit 0
            fi
            echo "External attempt $i: HTTP=$STATUS, retrying..."
            sleep 5
          done
          echo "External health check failed — likely DNS or cert still provisioning."
          echo "Internal health check passed on droplet. Caddy may still be retrying certs."
          exit 0
