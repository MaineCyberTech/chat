name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Resolve droplet IP
        id: ip
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID"
            done
          IP=$(curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
            | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | last | .networks.v4[0].ip_address // empty')
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Wait for SSH
        run: |
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          IP="${{ steps.ip.outputs.droplet_ip }}"
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/ssh_key root@$IP "echo ready" 2>/dev/null; then
              echo "SSH ready after $((i * 10))s"
              exit 0
            fi
            echo "Attempt $i: not ready, retrying in 10s..."
            sleep 10
          done
          echo "SSH never became available"
          exit 1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          IP="${{ steps.ip.outputs.droplet_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=10 -i /tmp/ssh_key root@$IP"

          echo "=== Setting up droplet ==="
          $SSH '
            cloud-init status --wait 2>/dev/null || true
            mkdir -p '"${REPO_DIR}"'/infra/docker/traefik
            touch '"${REPO_DIR}"'/infra/docker/traefik/acme.json
            chmod 600 '"${REPO_DIR}"'/infra/docker/traefik/acme.json

            # Write .env file
            cat > '"${REPO_DIR}"'/infra/docker/.env.devremote << ENVEOF
            SUPABASE_URL='"${SUPABASE_URL}"'
            SUPABASE_ANON_KEY='"${SUPABASE_ANON_KEY}"'
            SUPABASE_SERVICE_ROLE_KEY='"${SUPABASE_SERVICE_ROLE_KEY}"'
            NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us
            NEXT_PUBLIC_SUPABASE_URL='"${SUPABASE_URL}"'
            NEXT_PUBLIC_SUPABASE_ANON_KEY='"${SUPABASE_ANON_KEY}"'
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            PORT=4000
            NODE_ENV=development
            API_BASE_URL=https://chat-api.mainecybertech.us
            FRONTEND_URL=https://chat.mainecybertech.us
            ENVEOF

            for i in $(seq 1 12); do docker info >/dev/null 2>&1 && break; echo "Waiting for Docker $i..."; sleep 10; done
            # Free space before loading images
            docker image ls -q | xargs -r docker rmi -f 2>/dev/null || true
            docker system prune -af --volumes 2>/dev/null || true
          '

          echo "=== Transferring compose file ==="
          base64 -w0 infra/docker/docker-compose.devremote.yml | $SSH "base64 -d > ${REPO_DIR}/docker-compose.yml"

          echo "=== Transferring traefik config ==="
          base64 -w0 infra/docker/traefik/traefik.yml | $SSH "base64 -d > ${REPO_DIR}/infra/docker/traefik/traefik.yml"

          echo "=== Piping images ==="
          for IMG in api web; do
            docker pull ghcr.io/${{ env.REPO_LC }}/$IMG:dev
            docker save ghcr.io/${{ env.REPO_LC }}/$IMG:dev | gzip | $SSH "gunzip | docker load"
          done

          echo "=== Starting services ==="
          $SSH '
            cd '"${REPO_DIR}"'
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -af
          '

          rm -f /tmp/ssh_key