name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: droplet-ip
          path: /tmp
        continue-on-error: true

      - name: Resolve droplet IP
        id: ip
        run: |
          if [ -f /tmp/droplet_ip ]; then
            IP=$(cat /tmp/droplet_ip)
          else
            IP=$(curl -s -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
              "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" \
              | jq -r --arg name "chat-development" '.droplets[] | select(.name==$name) | .networks.v4[0].ip_address')
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Wait for droplet boot
        run: sleep 30

      - name: Setup droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          timeout: 180s
          command_timeout: 10m
          script: |
            if [ ! -d "${{ env.REPO_DIR }}" ]; then
              apt-get update -qq && apt-get install -y -qq git
              git clone https://github.com/${{ github.repository }}.git ${{ env.REPO_DIR }}
            fi
            cd ${{ env.REPO_DIR }}
            git fetch origin develop
            git checkout develop
            git pull origin develop
            cat > infra/docker/.env.devremote << 'EOF'
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            PORT=4000
            NODE_ENV=development
            API_BASE_URL=https://chat-api.mainecybertech.us
            FRONTEND_URL=https://chat.mainecybertech.us
            EOF
            mkdir -p infra/docker/traefik
            touch infra/docker/traefik/acme.json
            chmod 600 infra/docker/traefik/acme.json

      - name: Deploy containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          timeout: 180s
          command_timeout: 10m
          script: |
            cd ${{ env.REPO_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/${{ env.REPO_LC }}/api:dev
            docker pull ghcr.io/${{ env.REPO_LC }}/web:dev
            docker compose -f infra/docker/docker-compose.devremote.yml up -d --remove-orphans
            docker image prune -af

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chat-api.mainecybertech.us/healthz || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            echo "Attempt $i: returned $STATUS, retrying..."
            sleep 5
          done
          exit 1
