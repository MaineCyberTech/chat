name: Deploy to Droplet

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/docker/**"
      - ".github/workflows/deploy-development.yml"

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_DIR: /opt/chat

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Resolve droplet IP
        id: ip
        run: |
          set -e
          DO_TOKEN="${{ secrets.DO_API_TOKEN }}"
          ALL_DROPLETS=$(curl -sf -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?page=1&per_page=200")
          echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | .[:-1][] | .id' \
            | while read OLD_ID; do
              echo "Destroying old droplet $OLD_ID"
              curl -sf -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
                "https://api.digitalocean.com/v2/droplets/$OLD_ID" || true
            done
          IP=$(echo "$ALL_DROPLETS" | jq -r --arg name "chat-development" '[.droplets[] | select(.name==$name)] | sort_by(.created_at) | last | .networks.v4[0].ip_address // empty')
          if [ -z "$IP" ]; then
            echo "ERROR: No chat-development droplet found. Droplets:"
            echo "$ALL_DROPLETS" | jq '[.droplets[] | {name, ip: .networks.v4[0].ip_address, created: .created_at}]'
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

      - name: Setup droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2
            fi
            if ! git --version >/dev/null 2>&1; then
              apt-get install -y -qq git
            fi
            if [ ! -d "${{ env.REPO_DIR }}" ] || [ ! -d "${{ env.REPO_DIR }}/.git" ]; then
              rm -rf "${{ env.REPO_DIR }}"
              git clone https://github.com/${{ github.repository }}.git ${{ env.REPO_DIR }} || { echo "ERROR: git clone failed"; exit 1; }
            fi
            cd ${{ env.REPO_DIR }} && git fetch origin develop && git checkout develop && git reset --hard origin/develop

            CERT_DIR=${{ env.REPO_DIR }}/infra/docker/certs
            mkdir -p "$CERT_DIR"
            echo "${{ secrets.CF_ORIGIN_CERT }}" > "$CERT_DIR/fullchain.pem"
            echo "${{ secrets.CF_ORIGIN_KEY }}" > "$CERT_DIR/privkey.pem"
            chmod 600 "$CERT_DIR/privkey.pem"
            for i in $(seq 1 12); do docker info >/dev/null 2>&1 && break; echo 'Waiting for Docker...'; sleep 10; done
            if [ ! -f /swapfile ]; then
              fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            fi

            # Generate .env file with only non-empty secrets
            cat > ${{ env.REPO_DIR }}/.env << 'EOF'
            NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            NODE_ENV=development
            API_BASE_URL=https://chat-api.mainecybertech.us
            FRONTEND_URL=https://chat.mainecybertech.us
            EOF

            # Add secrets only if they're set
            if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> ${{ env.REPO_DIR }}/.env
              echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> ${{ env.REPO_DIR }}/.env
            fi
            if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
              echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> ${{ env.REPO_DIR }}/.env
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> ${{ env.REPO_DIR }}/.env
            fi
            if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
              echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> ${{ env.REPO_DIR }}/.env
            fi
            if [ -n "${{ secrets.VAPID_PUBLIC_KEY }}" ]; then
              echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> ${{ env.REPO_DIR }}/.env
            fi
            if [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]; then
              echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> ${{ env.REPO_DIR }}/.env
            fi

            # Also create .env in infra/docker for docker-compose
            mkdir -p ${{ env.REPO_DIR }}/infra/docker
            cp ${{ env.REPO_DIR }}/.env ${{ env.REPO_DIR }}/infra/docker/.env

            # Verify compose file exists
            if [ ! -f "infra/docker/docker-compose.devremote.yml" ]; then
              echo "ERROR: docker-compose.devremote.yml not found"
              exit 1
            fi

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/${{ env.REPO_LC }}/api:dev
            docker pull ghcr.io/${{ env.REPO_LC }}/web:dev
            docker compose -f infra/docker/docker-compose.devremote.yml up -d --remove-orphans
            docker image prune -af

            for i in $(seq 1 12); do
              if docker compose -f infra/docker/docker-compose.devremote.yml ps | grep -q "Unhealthy"; then
                echo "ERROR: Container unhealthy"
                docker compose -f infra/docker/docker-compose.devremote.yml logs --tail 50
                exit 1
              fi
              if docker compose -f infra/docker/docker-compose.devremote.yml ps | grep -q "(healthy)"; then
                echo "All containers healthy"
                docker compose -f infra/docker/docker-compose.devremote.yml ps
                exit 0
              fi
              echo "Waiting for containers to become healthy... ($i/12)"
              sleep 5
            done

            echo "ERROR: Containers did not become healthy"
            docker compose -f infra/docker/docker-compose.devremote.yml ps
            docker compose -f infra/docker/docker-compose.devremote.yml logs --tail 50
            exit 1

      - name: Health check
        run: |
          echo "=== External health check ==="
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://chat-api.mainecybertech.us/healthz --connect-timeout 5 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "External API healthy (HTTPS)"
              exit 0
            fi
            echo "Attempt $i: returned $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1
