name: hardening-automation-runner
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Hardening run ID
        required: true
        type: string
jobs:
  hardening-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - run: python scripts/hardening_runner/run_hardening_pipeline.py init --repo-root . --run-id "${{ inputs.run_id }}"
      - run: python scripts/hardening_runner/run_hardening_pipeline.py execute --repo-root . --run-id "${{ inputs.run_id }}"
      - run: python scripts/hardening_runner/run_hardening_pipeline.py finalize --repo-root . --run-id "${{ inputs.run_id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: hardening-run-${{ inputs.run_id }}
          path: docs/hardening_runs/${{ inputs.run_id }}/**
          if-no-files-found: error
