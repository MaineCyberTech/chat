name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Seed auth users via Admin API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -e

          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"
          AUTH_URL="${SUPABASE_URL}/auth/v1/admin/users"

          mgmt_query() {
            local sql="$1"
            curl -sf -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$sql" '{"query": $sql}')" 2>&1
          }

          echo "=== Current auth.users count ==="
          mgmt_query "SELECT count(*) as user_count FROM auth.users" || true

          echo ""
          echo "=== Deleting broken seed users from auth via Admin API ==="
          USER_IDS=$(mgmt_query "SELECT id::text FROM auth.users WHERE email LIKE '%@seed.test'" | jq -r '.[].id' 2>/dev/null || true)
          DELETED=0
          for SEED_UID in $USER_IDS; do
            if curl -sf -X DELETE "${AUTH_URL}/${SEED_UID}" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" 2>/dev/null; then
              DELETED=$((DELETED + 1))
            fi
          done
          echo "Deleted $DELETED broken auth users"

          echo "Auth users after cleanup:"
          mgmt_query "SELECT count(*) as user_count FROM auth.users" || true

          echo ""
          echo "=== Creating auth users via Supabase Auth Admin API ==="

          declare -A USERS=(
            ["a0000001-0000-4000-8000-000000000001"]="marcus@seed.test|Marcus Chen"
            ["a0000002-0000-4000-8000-000000000002"]="sarah@seed.test|Sarah Patel"
            ["a0000003-0000-4000-8000-000000000003"]="jake@seed.test|Jake Morrison"
            ["a0000004-0000-4000-8000-000000000004"]="elena@seed.test|Elena Volkov"
            ["a0000005-0000-4000-8000-000000000005"]="tyler@seed.test|Tyler Brooks"
            ["a0000006-0000-4000-8000-000000000006"]="priya@seed.test|Priya Sharma"
            ["a0000007-0000-4000-8000-000000000007"]="carlos@seed.test|Carlos Rivera"
            ["a0000008-0000-4000-8000-000000000008"]="aisha@seed.test|Aisha Johnson"
            ["a0000009-0000-4000-8000-000000000009"]="liam@seed.test|Liam O'Brien"
            ["a0000010-0000-4000-8000-000000000010"]="mei@seed.test|Mei Lin"
            ["a0000011-0000-4000-8000-000000000011"]="dmitri@seed.test|Dmitri Petrov"
            ["a0000012-0000-4000-8000-000000000012"]="nkechi@seed.test|Nkechi Adeyemi"
            ["a0000013-0000-4000-8000-000000000013"]="raj@seed.test|Raj Gupta"
            ["a0000014-0000-4000-8000-000000000014"]="fatima@seed.test|Fatima Al-Rashid"
            ["a0000015-0000-4000-8000-000000000015"]="tom@seed.test|Tom Nguyen"
            ["a0000016-0000-4000-8000-000000000016"]="admin@seed.test|Alex Admin"
            ["a0000017-0000-4000-8000-000000000017"]="olivia@seed.test|Olivia Foster"
            ["a0000018-0000-4000-8000-000000000018"]="jamal@seed.test|Jamal Williams"
            ["a0000019-0000-4000-8000-000000000019"]="chen@seed.test|Chen Wei"
            ["a0000020-0000-4000-8000-000000000020"]="sofia@seed.test|Sofia Rodriguez"
            ["a0000021-0000-4000-8000-000000000021"]="ethan@seed.test|Ethan Kowalski"
          )

          CREATED=0
          SKIPPED=0
          for ID in $(echo "${!USERS[@]}" | tr ' ' '\n' | sort); do
            IFS='|' read -r EMAIL NAME <<< "${USERS[$ID]}"
            RESULT=$(curl -sf -X POST "$AUTH_URL" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n \
                --arg id "$ID" \
                --arg email "$EMAIL" \
                --arg name "$NAME" \
                '{id: $id, email: $email, password: "password123", email_confirm: true, user_metadata: {display_name: $name}}')" 2>&1 || true)
            if echo "$RESULT" | jq -e '.id' >/dev/null 2>&1; then
              echo "  Created: $EMAIL ($NAME)"
              CREATED=$((CREATED + 1))
            elif echo "$RESULT" | grep -q "already exists"; then
              echo "  Exists: $EMAIL"
              SKIPPED=$((SKIPPED + 1))
            else
              echo "  WARN: $EMAIL - $(echo "$RESULT" | head -1)"
              SKIPPED=$((SKIPPED + 1))
            fi
          done
          echo "Created: $CREATED, Skipped/Existing: $SKIPPED"

          echo ""
          echo "=== Auth users after creation ==="
          mgmt_query "SELECT count(*) as user_count FROM auth.users" || true

          echo ""
          echo "=== Verifying a user is login-ready ==="
          mgmt_query "SELECT email, instance_id IS NOT NULL as has_instance, encrypted_password != '' as has_password FROM auth.users WHERE email = 'marcus@seed.test'" || true

      - name: Seed data tables via psql
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null 2>&1

          DB_URL="postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co:5432/postgres"

          # Try direct connection first, then pooler session mode, then pooler transaction mode
          if ! psql "$DB_URL" -c "SELECT 1" --set ON_ERROR_STOP=1 2>/dev/null; then
            echo "Direct connection failed. Trying pooler session mode (port 5432)..."
            DB_URL="postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
            if ! psql "$DB_URL" -c "SELECT 1" --set ON_ERROR_STOP=1 2>/dev/null; then
              echo "Pooler session mode failed. Trying pooler transaction mode (port 6543)..."
              DB_URL="postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:6543/postgres"
              psql "$DB_URL" -c "SELECT 1" --set ON_ERROR_STOP=1
            fi
          fi
          echo "Database connection verified."

          # Run seed files 01-05 (00 creates auth.users which we handled via Admin API)
          for f in supabase/seeds/0{1,2,3,4,5}*.sql; do
            [ -f "$f" ] || continue
            echo ""
            echo "-------------------------------------------"
            echo "Seeding $f..."
            echo "-------------------------------------------"
            psql "$DB_URL" -f "$f" --set ON_ERROR_STOP=1 || { echo "WARN: $f had errors (may be idempotent, continuing...)"; }
          done

          echo ""
          echo "=== Final verification ==="
          psql "$DB_URL" -c "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test'
          UNION ALL SELECT 'workspaces', count(*) FROM workspaces
          UNION ALL SELECT 'channels', count(*) FROM channels
          UNION ALL SELECT 'messages', count(*) FROM messages
          UNION ALL SELECT 'thread_replies', count(*) FROM thread_replies
          UNION ALL SELECT 'reactions', count(*) FROM reactions" --set ON_ERROR_STOP=1 || true

          echo ""
          echo "=== Seeding complete ==="
