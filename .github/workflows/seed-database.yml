name: Seed Database

# Seeds the self-hosted PostgreSQL inside the lab LXC.
#
# Replaces the previous implementation, which drove the hosted Supabase
# Management API (`POST /v1/projects/{ref}/database/query`) with a payload
# chunker to work around its 36 KB limit. That path only worked against a hosted
# project; schema and data now live on our own Postgres and are applied with
# scripts/db/apply-migrations.mjs.
#
# Safe to re-run: migrations are tracked in `public.schema_migrations` and
# skipped once applied. Seeds are fixtures and are re-applied in order.

on:
  workflow_dispatch:
    inputs:
      include_seeds:
        description: "Load demo seed data (uncheck to apply schema only)"
        type: boolean
        default: true
      reset:
        description: "DESTRUCTIVE: drop the public and auth schemas first"
        type: boolean
        default: false
  # Called by supabase-migrations.yml when migrations land on main/develop.
  workflow_call:
    inputs:
      include_seeds:
        type: boolean
        default: false
      reset:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seed-database
  cancel-in-progress: false

env:
  REPO_DIR: /opt/chat
  LAB_HOST: ${{ vars.LAB_LXC_HOST || '192.168.222.240' }}

jobs:
  seed:
    name: Seed
    runs-on: [self-hosted, linux, x64, lab-docker]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync schema, seeds and tooling to the target
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ env.LAB_HOST }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          source: "supabase,scripts/db,infra/docker/docker-compose.devremote.yml"
          target: "${{ env.REPO_DIR }}"

      - name: Apply schema and seeds
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.LAB_HOST }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.REPO_DIR }}

            if [ ! -f infra/docker/.env ]; then
              echo "ERROR: infra/docker/.env is missing; see docs/runbooks/lab-lxc-environment.md"
              exit 1
            fi
            set -a; . infra/docker/.env; set +a

            if [ "${{ inputs.reset }}" = "true" ]; then
              echo "=== RESET requested: dropping public + auth schemas ==="
              docker exec chat-postgres-dev psql -U postgres -d chat -q -c \
                "drop schema if exists public cascade; drop schema if exists auth cascade; create schema public;"
            fi

            echo "=== migration status before ==="
            node scripts/db/apply-migrations.mjs --docker chat-postgres-dev --status || true

            SEED_FLAG=""
            if [ "${{ inputs.include_seeds }}" = "true" ]; then SEED_FLAG="--seed"; fi
            node scripts/db/apply-migrations.mjs --docker chat-postgres-dev $SEED_FLAG

            echo
            echo "=== migration status after ==="
            node scripts/db/apply-migrations.mjs --docker chat-postgres-dev --status

            echo
            echo "=== data verification ==="
            docker exec chat-postgres-dev psql -U postgres -d chat -t -A -F'|' -c "
            select 'auth_users', count(*) from auth.users where email like '%@seed.test'
            union all select 'identities', count(*) from auth.identities
            union all select 'public_users', count(*) from public.users
            union all select 'workspaces', count(*) from public.workspaces
            union all select 'channels', count(*) from public.channels
            union all select 'messages', count(*) from public.messages
            union all select 'thread_replies', count(*) from public.messages where parent_id is not null
            union all select 'reactions', count(*) from public.reactions
            union all select 'rls_tables', count(*) from pg_tables where schemaname='public' and rowsecurity;"

            echo
            echo "=== seed logins usable (bcrypt) ==="
            docker exec chat-postgres-dev psql -U postgres -d chat -t -A -c "
            select case when public.auth_verify_password('marcus@seed.test','password123') is not null
                        then 'marcus@seed.test / password123  OK'
                        else 'marcus@seed.test / password123  FAILED' end;"

            echo
            echo "=== RLS conformance ==="
            docker exec -i chat-postgres-dev psql -U postgres -d chat -v ON_ERROR_STOP=1 -q -f - \
              < supabase/tests/rls_tenant_isolation.sql | tail -2

      - name: Summary
        if: always()
        run: |
          {
            echo "### Seed database (lab LXC)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`${{ env.LAB_HOST }}\` |"
            echo "| Seeds | ${{ inputs.include_seeds }} |"
            echo "| Reset | ${{ inputs.reset }} |"
          } >> "$GITHUB_STEP_SUMMARY"
