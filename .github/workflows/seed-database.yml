name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          API_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          echo "=== Testing connectivity via Management API ==="
          RESULT=$(curl -sf -X POST "$API_URL" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT count(*) as user_count FROM auth.users"}' 2>&1) || {
              echo "ERROR: Management API connection failed"
              echo "$RESULT"
              exit 1
            }
          echo "Current auth.users: $RESULT"
          echo ""

          echo "=== Running seed files ==="
          for f in supabase/seeds/*.sql; do
            echo ""
            echo "-------------------------------------------"
            echo "Seeding $f..."
            echo "-------------------------------------------"

            # Read SQL and escape for JSON
            SQL=$(cat "$f")

            # Post SQL via Management API
            RESPONSE=$(curl -sf -X POST "$API_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$SQL" '{"query": $sql}')" 2>&1) || {
                echo "WARN: $f had errors (may be idempotent, continuing...)"
                echo "$RESPONSE"
                continue
              }
            echo "OK: $f"
            echo "$RESPONSE" | head -5
          done

          echo ""
          echo "=== Final auth.users count ==="
          curl -sf -X POST "$API_URL" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT count(*) as user_count FROM auth.users"}' || true

          echo ""
          echo "=== Seeding complete ==="
