name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fix auth.users NULL tokens + seed via Admin API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -e
          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"
          AUTH_URL="${SUPABASE_URL}/auth/v1/admin/users"

          mgmt_query() {
            RESP=$(curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1)
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -n -1)
            echo "$BODY"
            if [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
              echo "MGMT_ERROR($HTTP_CODE)" >&2
            fi
          }

          echo "=== Step 0: Fix NULL string columns in auth.users ==="
          echo "GoTrue crashes on NULL confirmation_token. Fix all string columns."
          mgmt_query "
            UPDATE auth.users SET
              confirmation_token = COALESCE(confirmation_token, ''),
              recovery_token = COALESCE(recovery_token, ''),
              email_change_token_new = COALESCE(email_change_token_new, ''),
              email_change_token_current = COALESCE(email_change_token_current, ''),
              email_change = COALESCE(email_change, ''),
              phone_change = COALESCE(phone_change, ''),
              phone_change_token = COALESCE(phone_change_token, '')
            WHERE confirmation_token IS NULL
               OR recovery_token IS NULL
               OR email_change_token_new IS NULL
               OR email_change_token_current IS NULL;
          " || true

          echo ""
          echo "=== Current auth.users count ==="
          mgmt_query "SELECT count(*) as user_count FROM auth.users" || true

          echo ""
          echo "=== Verify NULL tokens fixed ==="
          mgmt_query "SELECT email, confirmation_token, recovery_token, email_change_token_new, email_change_token_current FROM auth.users WHERE email LIKE '%@seed.test' LIMIT 3" || true

          echo ""
          echo "=== Check ALL remaining NULL tokens ==="
          mgmt_query "SELECT count(*) as null_tokens FROM auth.users WHERE confirmation_token IS NULL OR recovery_token IS NULL" || true

          echo ""
          echo "=== Step 1: Delete seed users via Management SQL ==="
          echo "Admin API DELETE crashes GoTrue (trigger/FK issue). Use SQL directly."
          mgmt_query "
            DELETE FROM auth.refresh_tokens WHERE user_id IN (SELECT id::text FROM auth.users WHERE email LIKE '%@seed.test');
            DELETE FROM auth.identities WHERE user_id IN (SELECT id::text FROM auth.users WHERE email LIKE '%@seed.test');
            DELETE FROM auth.users WHERE email LIKE '%@seed.test';
          " || true

          echo ""
          echo "=== Verify deletion ==="
          mgmt_query "SELECT count(*) as remaining FROM auth.users WHERE email LIKE '%@seed.test'" || true

          echo ""
          echo "=== Step 2: Create auth users via Admin API ==="
          declare -A USERS=(
            ["a0000001-0000-4000-8000-000000000001"]="marcus@seed.test|Marcus Chen"
            ["a0000002-0000-4000-8000-000000000002"]="sarah@seed.test|Sarah Patel"
            ["a0000003-0000-4000-8000-000000000003"]="jake@seed.test|Jake Morrison"
            ["a0000004-0000-4000-8000-000000000004"]="elena@seed.test|Elena Volkov"
            ["a0000005-0000-4000-8000-000000000005"]="tyler@seed.test|Tyler Brooks"
            ["a0000006-0000-4000-8000-000000000006"]="priya@seed.test|Priya Sharma"
            ["a0000007-0000-4000-8000-000000000007"]="carlos@seed.test|Carlos Rivera"
            ["a0000008-0000-4000-8000-000000000008"]="aisha@seed.test|Aisha Johnson"
            ["a0000009-0000-4000-8000-000000000009"]="liam@seed.test|Liam O'Brien"
            ["a0000010-0000-4000-8000-000000000010"]="mei@seed.test|Mei Lin"
            ["a0000011-0000-4000-8000-000000000011"]="dmitri@seed.test|Dmitri Petrov"
            ["a0000012-0000-4000-8000-000000000012"]="nkechi@seed.test|Nkechi Adeyemi"
            ["a0000013-0000-4000-8000-000000000013"]="raj@seed.test|Raj Gupta"
            ["a0000014-0000-4000-8000-000000000014"]="fatima@seed.test|Fatima Al-Rashid"
            ["a0000015-0000-4000-8000-000000000015"]="tom@seed.test|Tom Nguyen"
            ["a0000016-0000-4000-8000-000000000016"]="admin@seed.test|Alex Admin"
            ["a0000017-0000-4000-8000-000000000017"]="olivia@seed.test|Olivia Foster"
            ["a0000018-0000-4000-8000-000000000018"]="jamal@seed.test|Jamal Williams"
            ["a0000019-0000-4000-8000-000000000019"]="chen@seed.test|Chen Wei"
            ["a0000020-0000-4000-8000-000000000020"]="sofia@seed.test|Sofia Rodriguez"
            ["a0000021-0000-4000-8000-000000000021"]="ethan@seed.test|Ethan Kowalski"
          )
          CREATED=0
          SKIPPED=0
          for ID in $(echo "${!USERS[@]}" | tr ' ' '\n' | sort); do
            IFS='|' read -r EMAIL NAME <<< "${USERS[$ID]}"
            CREATE_RESP=$(curl -s -w "\n%{http_code}" -X POST "$AUTH_URL" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg id "$ID" --arg email "$EMAIL" --arg name "$NAME" \
                '{id: $id, email: $email, password: "password123", email_confirm: true, user_metadata: {display_name: $name}}')" 2>&1)
            CREATE_CODE=$(echo "$CREATE_RESP" | tail -1)
            CREATE_BODY=$(echo "$CREATE_RESP" | head -n -1)
            if echo "$CREATE_BODY" | jq -e '.id' >/dev/null 2>&1; then
              echo "  Created: $EMAIL ($NAME)"
              CREATED=$((CREATED + 1))
            elif echo "$CREATE_BODY" | grep -q "already exists"; then
              echo "  Exists: $EMAIL"
              SKIPPED=$((SKIPPED + 1))
            else
              echo "  WARN: $EMAIL - HTTP $CREATE_CODE - $(echo "$CREATE_BODY" | head -1)"
              SKIPPED=$((SKIPPED + 1))
            fi
          done
          echo "Created: $CREATED, Skipped/Existing: $SKIPPED"

          echo ""
          echo "=== Step 3: Verify identities ==="
          echo "auth.users count:"
          mgmt_query "SELECT count(*) as user_count FROM auth.users WHERE email LIKE '%@seed.test'" || true
          echo "auth.identities count:"
          mgmt_query "SELECT count(*) as identity_count FROM auth.identities WHERE provider = 'email' AND email IN (SELECT email FROM auth.users WHERE email LIKE '%@seed.test')" || true
          echo "Sample login-ready user:"
          mgmt_query "SELECT u.email, u.encrypted_password != '' as has_password, i.provider, i.identity_data FROM auth.users u JOIN auth.identities i ON i.user_id = u.id WHERE u.email = 'marcus@seed.test'" || true

          echo ""
          echo "=== Step 4: Check if identities still missing ==="
          MISSING=$(mgmt_query "SELECT count(*) as cnt FROM auth.users u WHERE u.email LIKE '%@seed.test' AND NOT EXISTS (SELECT 1 FROM auth.identities i WHERE i.user_id = u.id AND i.provider = 'email')" | jq -r '.[0].cnt' 2>/dev/null || echo "-1")
          echo "Users missing identities: $MISSING"

      - name: Write chunk splitter script
        run: |
          cat > /tmp/split_seed.py << 'PYEOF'
          import sys, os
          filepath = sys.argv[1]
          target_kb = int(sys.argv[2]) if len(sys.argv) > 2 else 20
          target_bytes = target_kb * 1024

          with open(filepath) as f:
              content = f.read()

          lines = content.split("\n")
          chunks = []
          current = []
          current_size = 0

          for line in lines:
              current.append(line)
              current_size += len(line) + 1
              if line.strip().endswith(";") and current_size >= target_bytes:
                  chunks.append("\n".join(current))
                  current = []
                  current_size = 0

          if current:
              chunks.append("\n".join(current))

          for i, chunk in enumerate(chunks):
              outpath = f"/tmp/seed_chunk_{i:03d}.sql"
              with open(outpath, "w") as out:
                  out.write(chunk)

          print(len(chunks))
          PYEOF
          echo "Script written."

      - name: Seed data tables via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          mgmt_send() {
            curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1
          }

          echo "=== Running seed files 01-05 ==="
          for f in supabase/seeds/0{1,2,3,4,5}*.sql; do
            [ -f "$f" ] || continue
            echo ""
            echo "Seeding $f..."
            SQL_SIZE=$(wc -c < "$f")
            echo "File size: ${SQL_SIZE} bytes"

            if [ "$SQL_SIZE" -gt 20000 ]; then
              echo "Splitting into chunks..."
              rm -f /tmp/seed_chunk_*.sql
              NUM_CHUNKS=$(python3 /tmp/split_seed.py "$f" 20)
              echo "Split into $NUM_CHUNKS chunks"

              SENT=0
              FAILED=0
              for chunk_file in /tmp/seed_chunk_*.sql; do
                [ -f "$chunk_file" ] || continue
                CHUNK_SQL=$(cat "$chunk_file")
                CHUNK_SIZE=${#CHUNK_SQL}
                RESP=$(mgmt_send "$CHUNK_SQL")
                HTTP_CODE=$(echo "$RESP" | tail -1)
                BODY=$(echo "$RESP" | head -n -1)
                if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - OK"
                  SENT=$((SENT + 1))
                else
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - FAIL ($HTTP_CODE)"
                  echo "  $(echo "$BODY" | head -1)"
                  FAILED=$((FAILED + 1))
                fi
              done
              rm -f /tmp/seed_chunk_*.sql
              echo "Result: $SENT OK, $FAILED failed"
            else
              RESP=$(mgmt_send "$(cat "$f")")
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | head -n -1)
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "OK ($HTTP_CODE)"
              else
                echo "FAIL ($HTTP_CODE): $(echo "$BODY" | head -3)"
              fi
            fi
          done

          echo ""
          echo "=== Final verification ==="
          RESP=$(mgmt_send "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'workspaces', count(*) FROM workspaces UNION ALL SELECT 'channels', count(*) FROM channels UNION ALL SELECT 'messages', count(*) FROM messages UNION ALL SELECT 'thread_replies', count(*) FROM messages WHERE parent_id IS NOT NULL UNION ALL SELECT 'reactions', count(*) FROM reactions")
          echo "$RESP" | head -n -1
          echo ""
          echo "=== Seeding complete ==="
