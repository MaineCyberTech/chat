name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Seed auth users via Management API SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          mgmt_query() {
            RESP=$(curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1)
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -n -1)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "$BODY"
            else
              echo "ERROR($HTTP_CODE): $BODY" >&2
              return 1
            fi
          }

          echo "=== Current auth.users count ==="
          mgmt_query "SELECT count(*) as user_count FROM auth.users" || true

          echo ""
          echo "=== Cleaning seed auth data ==="
          mgmt_query "DELETE FROM auth.refresh_tokens WHERE session_id IN (SELECT id FROM auth.sessions WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE '%.seed.test'))" || true
          mgmt_query "DELETE FROM auth.sessions WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE '%.seed.test')" || true
          mgmt_query "DELETE FROM auth.mfa_factors WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE '%.seed.test')" || true
          mgmt_query "DELETE FROM auth.identities WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE '%.seed.test')" || true
          mgmt_query "DELETE FROM auth.users WHERE email LIKE '%.seed.test'" || true

          echo ""
          echo "=== Creating auth.users ==="
          mgmt_query "
            INSERT INTO auth.users (
              instance_id, id, aud, role, email, encrypted_password,
              email_confirmed_at, created_at, updated_at, confirmation_token,
              recovery_token, email_change_token_new, email_change, raw_app_meta_data,
              raw_user_meta_data, last_sign_in_at, is_super_admin
            )
            SELECT
              (SELECT id FROM auth.instances LIMIT 1),
              v.id,
              'authenticated',
              'authenticated',
              v.email,
              '$2a$10$v6eIqtfdO8MPMAg6HEJUU.eHvG1iZ9bIl/apu.boe3WW5wvr2Lr2W',
              now(), now(), now(),
              '', '', '', '',
              '{\"provider\":\"email\",\"providers\":[\"email\"]}',
              jsonb_build_object('display_name', v.name),
              NULL,
              false
            FROM (VALUES
              ('a0000001-0000-4000-8000-000000000001'::uuid, 'marcus@seed.test', 'Marcus Chen'),
              ('a0000002-0000-4000-8000-000000000002'::uuid, 'sarah@seed.test', 'Sarah Patel'),
              ('a0000003-0000-4000-8000-000000000003'::uuid, 'jake@seed.test', 'Jake Morrison'),
              ('a0000004-0000-4000-8000-000000000004'::uuid, 'elena@seed.test', 'Elena Volkov'),
              ('a0000005-0000-4000-8000-000000000005'::uuid, 'tyler@seed.test', 'Tyler Brooks'),
              ('a0000006-0000-4000-8000-000000000006'::uuid, 'priya@seed.test', 'Priya Sharma'),
              ('a0000007-0000-4000-8000-000000000007'::uuid, 'carlos@seed.test', 'Carlos Rivera'),
              ('a0000008-0000-4000-8000-000000000008'::uuid, 'aisha@seed.test', 'Aisha Johnson'),
              ('a0000009-0000-4000-8000-000000000009'::uuid, 'liam@seed.test', 'Liam O''Brien'),
              ('a0000010-0000-4000-8000-000000000010'::uuid, 'mei@seed.test', 'Mei Lin'),
              ('a0000011-0000-4000-8000-000000000011'::uuid, 'dmitri@seed.test', 'Dmitri Petrov'),
              ('a0000012-0000-4000-8000-000000000012'::uuid, 'nkechi@seed.test', 'Nkechi Adeyemi'),
              ('a0000013-0000-4000-8000-000000000013'::uuid, 'raj@seed.test', 'Raj Gupta'),
              ('a0000014-0000-4000-8000-000000000014'::uuid, 'fatima@seed.test', 'Fatima Al-Rashid'),
              ('a0000015-0000-4000-8000-000000000015'::uuid, 'tom@seed.test', 'Tom Nguyen'),
              ('a0000016-0000-4000-8000-000000000016'::uuid, 'admin@seed.test', 'Alex Admin'),
              ('a0000017-0000-4000-8000-000000000017'::uuid, 'olivia@seed.test', 'Olivia Foster'),
              ('a0000018-0000-4000-8000-000000000018'::uuid, 'jamal@seed.test', 'Jamal Williams'),
              ('a0000019-0000-4000-8000-000000000019'::uuid, 'chen@seed.test', 'Chen Wei'),
              ('a0000020-0000-4000-8000-000000000020'::uuid, 'sofia@seed.test', 'Sofia Rodriguez'),
              ('a0000021-0000-4000-8000-000000000021'::uuid, 'ethan@seed.test', 'Ethan Kowalski')
            ) AS v(id, email, name);
          " || true

          echo ""
          echo "=== Creating auth.identities ==="
          mgmt_query "
            INSERT INTO auth.identities (
              id, provider_id, user_id, identity_data, provider,
              last_sign_in_at, created_at, updated_at, email
            )
            SELECT
              u.id,
              u.email,
              u.id,
              jsonb_build_object(
                'sub', u.id::text,
                'email', u.email,
                'email_verified', true,
                'phone_verified', false
              ),
              'email',
              NULL,
              u.created_at,
              u.updated_at,
              u.email
            FROM auth.users u
            WHERE u.email LIKE '%.seed.test';
          " || true

          echo ""
          echo "=== Verifying ==="
          echo "auth.users count:"
          mgmt_query "SELECT count(*) as user_count FROM auth.users WHERE email LIKE '%.seed.test'" || true
          echo "auth.identities count:"
          mgmt_query "SELECT count(*) as identity_count FROM auth.identities WHERE provider = 'email' AND email LIKE '%.seed.test'" || true
          echo "Sample login-ready user:"
          mgmt_query "SELECT u.email, u.encrypted_password != '' as has_password, i.provider, i.identity_data FROM auth.users u JOIN auth.identities i ON i.user_id = u.id WHERE u.email = 'marcus@seed.test'" || true

      - name: Write chunk splitter script
        run: |
          cat > /tmp/split_seed.py << 'PYEOF'
          import sys, os
          filepath = sys.argv[1]
          target_kb = int(sys.argv[2]) if len(sys.argv) > 2 else 20
          target_bytes = target_kb * 1024

          with open(filepath) as f:
              content = f.read()

          lines = content.split("\n")
          chunks = []
          current = []
          current_size = 0

          for line in lines:
              current.append(line)
              current_size += len(line) + 1
              if line.strip().endswith(";") and current_size >= target_bytes:
                  chunks.append("\n".join(current))
                  current = []
                  current_size = 0

          if current:
              chunks.append("\n".join(current))

          for i, chunk in enumerate(chunks):
              outpath = f"/tmp/seed_chunk_{i:03d}.sql"
              with open(outpath, "w") as out:
                  out.write(chunk)

          print(len(chunks))
          PYEOF
          echo "Script written."

      - name: Seed data tables via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          mgmt_send() {
            curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1
          }

          echo "=== Running seed files 01-05 ==="
          for f in supabase/seeds/0{1,2,3,4,5}*.sql; do
            [ -f "$f" ] || continue
            echo ""
            echo "Seeding $f..."
            SQL_SIZE=$(wc -c < "$f")
            echo "File size: ${SQL_SIZE} bytes"

            if [ "$SQL_SIZE" -gt 20000 ]; then
              echo "Splitting into chunks..."
              rm -f /tmp/seed_chunk_*.sql
              NUM_CHUNKS=$(python3 /tmp/split_seed.py "$f" 20)
              echo "Split into $NUM_CHUNKS chunks"

              SENT=0
              FAILED=0
              for chunk_file in /tmp/seed_chunk_*.sql; do
                [ -f "$chunk_file" ] || continue
                CHUNK_SQL=$(cat "$chunk_file")
                CHUNK_SIZE=${#CHUNK_SQL}
                RESP=$(mgmt_send "$CHUNK_SQL")
                HTTP_CODE=$(echo "$RESP" | tail -1)
                BODY=$(echo "$RESP" | head -n -1)
                if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - OK"
                  SENT=$((SENT + 1))
                else
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - FAIL ($HTTP_CODE)"
                  echo "  $(echo "$BODY" | head -1)"
                  FAILED=$((FAILED + 1))
                fi
              done
              rm -f /tmp/seed_chunk_*.sql
              echo "Result: $SENT OK, $FAILED failed"
            else
              RESP=$(mgmt_send "$(cat "$f")")
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | head -n -1)
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "OK ($HTTP_CODE)"
              else
                echo "FAIL ($HTTP_CODE): $(echo "$BODY" | head -3)"
              fi
            fi
          done

          echo ""
          echo "=== Final verification ==="
          RESP=$(mgmt_send "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'workspaces', count(*) FROM workspaces UNION ALL SELECT 'channels', count(*) FROM channels UNION ALL SELECT 'messages', count(*) FROM messages UNION ALL SELECT 'thread_replies', count(*) FROM messages WHERE parent_id IS NOT NULL UNION ALL SELECT 'reactions', count(*) FROM reactions")
          echo "$RESP" | head -n -1
          echo ""
          echo "=== Seeding complete ==="
