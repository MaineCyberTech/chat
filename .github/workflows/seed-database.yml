name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  seed:
    name: Seed ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fix NULL tokens + insert identities + seed auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          mgmt_query() {
            RESP=$(curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1)
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -n -1)
            echo "$BODY"
            if [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
              echo "MGMT_ERROR($HTTP_CODE)" >&2
            fi
          }

          echo "=== Step 0: Fix NULL string columns in auth.users ==="
          echo "GoTrue crashes on NULL confirmation_token. Fix all string columns."
          mgmt_query "
            UPDATE auth.users SET
              confirmation_token = COALESCE(confirmation_token, ''),
              recovery_token = COALESCE(recovery_token, ''),
              email_change_token_new = COALESCE(email_change_token_new, ''),
              email_change_token_current = COALESCE(email_change_token_current, ''),
              email_change = COALESCE(email_change, ''),
              phone_change = COALESCE(phone_change, ''),
              phone_change_token = COALESCE(phone_change_token, '')
            WHERE confirmation_token IS NULL
               OR recovery_token IS NULL
               OR email_change_token_new IS NULL
               OR email_change_token_current IS NULL;
          " || true

          echo ""
          echo "=== Step 1: Insert missing identities + set passwords ==="
          echo "Auth.identities are missing — GoTrue can't authenticate without them."
          mgmt_query "INSERT INTO auth.identities (id, user_id, identity_data, provider, provider_id, last_sign_in_at, created_at, updated_at) SELECT gen_random_uuid(), u.id, ('{\"email\":\"' || u.email || '\",\"sub\":\"' || u.id::text || '\",\"email_verified\":true}')::jsonb, 'email', ('email:' || u.id::text), now(), now(), now() FROM auth.users u WHERE u.email LIKE '%@seed.test' AND NOT EXISTS (SELECT 1 FROM auth.identities i WHERE i.user_id = u.id AND i.provider = 'email')" || true
          mgmt_query "UPDATE auth.users SET encrypted_password = '\$2a\$10\$v6eIqtfdO8MPMAg6HEJUU.eHvG1iZ9bIl/apu.boe3WW5wvr2Lr2W' WHERE email LIKE '%@seed.test'" || true
          mgmt_query "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'identities', count(*) FROM auth.identities WHERE provider = 'email' AND user_id IN (SELECT id FROM auth.users WHERE email LIKE '%@seed.test')" || true

      - name: Write chunk splitter script
        run: |
          cat > /tmp/split_seed.py << 'PYEOF'
          import sys, os
          filepath = sys.argv[1]
          target_kb = int(sys.argv[2]) if len(sys.argv) > 2 else 20
          target_bytes = target_kb * 1024

          with open(filepath) as f:
              content = f.read()

          lines = content.split("\n")
          chunks = []
          current = []
          current_size = 0

          for line in lines:
              current.append(line)
              current_size += len(line) + 1
              if line.strip().endswith(";") and current_size >= target_bytes:
                  chunks.append("\n".join(current))
                  current = []
                  current_size = 0

          if current:
              chunks.append("\n".join(current))

          for i, chunk in enumerate(chunks):
              outpath = f"/tmp/seed_chunk_{i:03d}.sql"
              with open(outpath, "w") as out:
                  out.write(chunk)

          print(len(chunks))
          PYEOF
          echo "Script written."

      - name: Seed data tables via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="${{ env.SUPABASE_PROJECT_REF }}"
          MGMT_URL="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          mgmt_send() {
            curl -s -w "\n%{http_code}" -X POST "$MGMT_URL" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$(jq -n --arg sql "$1" '{"query": $sql}')" 2>&1
          }

          echo "=== Running seed files 01-05 ==="
          for f in supabase/seeds/0{1,2,3,4,5}*.sql; do
            [ -f "$f" ] || continue
            echo ""
            echo "Seeding $f..."
            SQL_SIZE=$(wc -c < "$f")
            echo "File size: ${SQL_SIZE} bytes"

            if [ "$SQL_SIZE" -gt 20000 ]; then
              echo "Splitting into chunks..."
              rm -f /tmp/seed_chunk_*.sql
              NUM_CHUNKS=$(python3 /tmp/split_seed.py "$f" 20)
              echo "Split into $NUM_CHUNKS chunks"

              SENT=0
              FAILED=0
              for chunk_file in /tmp/seed_chunk_*.sql; do
                [ -f "$chunk_file" ] || continue
                CHUNK_SQL=$(cat "$chunk_file")
                CHUNK_SIZE=${#CHUNK_SQL}
                RESP=$(mgmt_send "$CHUNK_SQL")
                HTTP_CODE=$(echo "$RESP" | tail -1)
                BODY=$(echo "$RESP" | head -n -1)
                if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - OK"
                  SENT=$((SENT + 1))
                else
                  echo "  $(basename $chunk_file): ${CHUNK_SIZE}B - FAIL ($HTTP_CODE)"
                  echo "  $(echo "$BODY" | head -1)"
                  FAILED=$((FAILED + 1))
                fi
              done
              rm -f /tmp/seed_chunk_*.sql
              echo "Result: $SENT OK, $FAILED failed"
            else
              RESP=$(mgmt_send "$(cat "$f")")
              HTTP_CODE=$(echo "$RESP" | tail -1)
              BODY=$(echo "$RESP" | head -n -1)
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "OK ($HTTP_CODE)"
              else
                echo "FAIL ($HTTP_CODE): $(echo "$BODY" | head -3)"
              fi
            fi
          done

          echo ""
          echo "=== Final verification ==="
          RESP=$(mgmt_send "SELECT 'auth_users' as tbl, count(*) FROM auth.users WHERE email LIKE '%@seed.test' UNION ALL SELECT 'workspaces', count(*) FROM workspaces UNION ALL SELECT 'channels', count(*) FROM channels UNION ALL SELECT 'messages', count(*) FROM messages UNION ALL SELECT 'thread_replies', count(*) FROM messages WHERE parent_id IS NOT NULL UNION ALL SELECT 'reactions', count(*) FROM reactions")
          echo "$RESP" | head -n -1
          echo ""
          echo "=== Seeding complete ==="
