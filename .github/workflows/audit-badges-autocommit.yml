name: audit-badges-autocommit
on:
  push:
    branches: [main, master, development, dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  badges-autocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audits/generate_badges.py --repo-root .
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(audits): refresh hardening operator edition badges'
          file_pattern: docs/hardening_super_bundle/examples/dashboard/**
