name: audit-badges-autocommit
on:
  push:
    branches: [main, master, development, dev]
    paths:
      - "hardening/**"
      - "scripts/audits/generate_badges.py"
      - ".github/workflows/audit-badges-autocommit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  badges-autocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/audits/generate_badges.py --repo-root .
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore(audits): refresh hardening operator edition badges [skip ci]"
          file_pattern: docs/hardening_super_bundle/examples/dashboard/**
