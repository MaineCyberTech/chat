name: audit-badges-autocommit
on:
  push:
    branches: [main, master, development, dev]
    paths:
      - "hardening/**"
      - "scripts/audits/generate_badges.py"
      - ".github/workflows/audit-badges-autocommit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  badges-autocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/audits/generate_badges.py --repo-root .
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(audits): refresh hardening operator edition badges [skip ci]"
          file_pattern: docs/hardening_super_bundle/examples/dashboard/**
