name: audit-badges-autocommit
on:
  push:
    branches: [main, develop, master, release/**]
    paths:
      - "hardening/**"
      - "scripts/audits/generate_badges.py"
      - ".github/workflows/audit-badges-autocommit.yml"
  workflow_dispatch:

# CI-P2-002: propose badge refreshes via a bot PR instead of pushing generated
# files straight to the target branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  badges-autocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/audits/generate_badges.py --repo-root .
      - name: Propose badge artifacts
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(audits): refresh hardening operator edition badges [skip ci]"
          title: "chore(audits): refresh hardening operator edition badges"
          body: |
            Automated refresh of the generated hardening badges.

            Opened by `.github/workflows/audit-badges-autocommit.yml` (CI-P2-002);
            the workflow no longer pushes generated files directly to the branch.
          branch: chore/audit-badges-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            docs/hardening_super_bundle/examples/dashboard/**
