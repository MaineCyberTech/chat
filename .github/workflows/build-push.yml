name: Build and Push Images

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-push.yml"

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: development

jobs:
  build-images:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:dev
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://chat-api.mainecybertech.us
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:dev
            ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
