name: Build and Push Images

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: &build-paths
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/build-push.yml"
  pull_request:
    branches: [develop, main]
    paths: *build-paths

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: development

jobs:
  build-images:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          # CI-P2-006: pull requests must never publish images. PRs build only and
          # load the result locally so the Trivy image scan inspects the PR build;
          # only trusted branch pushes / manual dispatch publish to GHCR.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:dev
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          # CI-P2-006: build-only on pull requests (see the API image step above).
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/worker:dev
            ghcr.io/${{ env.REPO_LC }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          # CI-P2-006: build-only on pull requests (see the API image step above).
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.mainecybertech.us
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pusher.date || '' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:dev
            ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # SBOMs are produced for every image this workflow pushes (all branches), not just
      # develop. The step names match the actual `format` (SPDX JSON).
      - name: Generate SBOM (SPDX) - API
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sbom-api
          path: apps/api
          format: spdx-json
        if: github.event_name == 'push'

      - name: Generate SBOM (SPDX) - Worker
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sbom-worker
          path: apps/worker
          format: spdx-json
        if: github.event_name == 'push'

      - name: Generate SBOM (SPDX) - Web
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: sbom-web
          path: apps/web
          format: spdx-json
        if: github.event_name == 'push'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom-api.spdx.json
            sbom-worker.spdx.json
            sbom-web.spdx.json
        if: github.event_name == 'push'

      - name: Run Trivy vulnerability scanner (API image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ env.REPO_LC }}/api:dev"
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "HIGH,CRITICAL"
          # Blocking: fail on HIGH/CRITICAL image findings (allowlist via .trivyignore).
          exit-code: "1"

      - name: Run Trivy vulnerability scanner (Web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ env.REPO_LC }}/web:dev"
          format: "sarif"
          output: "trivy-web.sarif"
          severity: "HIGH,CRITICAL"
          # Blocking: fail on HIGH/CRITICAL image findings (allowlist via .trivyignore).
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('trivy-api.sarif') != ''
        with:
          sarif_file: "trivy-api.sarif"
          category: "trivy-api"

      - name: Upload Trivy results to GitHub Security (Web)
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('trivy-web.sarif') != ''
        with:
          sarif_file: "trivy-web.sarif"
          category: "trivy-web"
