name: Build and Push Images

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: &build-paths
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/build-push.yml"
  pull_request:
    branches: [develop, main]
    paths: *build-paths

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: development

jobs:
  build-images:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase repo
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:dev
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/worker:dev
            ghcr.io/${{ env.REPO_LC }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://chat.mainecybertech.us
            NEXT_PUBLIC_APP_URL=https://chat.mainecybertech.us
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pusher.date || '' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:dev
            ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-api
          path: apps/api
          format: spdx-json
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

      - name: Generate SBOM (CycloneDX) - Web
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-web
          path: apps/web
          format: spdx-json
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-api.spdx.json
            sbom-web.spdx.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

      - name: Run Trivy vulnerability scanner (API image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ env.REPO_LC }}/api:dev"
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (Web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ env.REPO_LC }}/web:dev"
          format: "sarif"
          output: "trivy-web.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-api.sarif') != ''
        with:
          sarif_file: "trivy-api.sarif"
          category: "trivy-api"

      - name: Upload Trivy results to GitHub Security (Web)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-web.sarif') != ''
        with:
          sarif_file: "trivy-web.sarif"
          category: "trivy-web"
