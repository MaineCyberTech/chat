name: audit-ci-autocommit

on:
  push:
    branches:
      - main
      - master
      - development
      - dev
      - release/**
    paths:
      - "docs/audits/runs/**"
      - "scripts/audits/generate_dashboard.py"
      - ".github/workflows/audit-ci-autocommit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Regenerate audit dashboard
        run: |
          if [ -d docs/audits/runs ]; then
            python scripts/audits/generate_dashboard.py --repo-root . || true
          fi

      - name: Auto-commit dashboard artifacts
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(audits): refresh dashboard artifacts [skip ci]"
          file_pattern: docs/audits/dashboard/** docs/audits/latest_run.json
