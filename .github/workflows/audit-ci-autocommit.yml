name: audit-ci-autocommit

on:
  push:
    branches:
      - main
      - develop
      - master
      - release/**
    paths:
      - "docs/audits/runs/**"
      - "scripts/audits/generate_dashboard.py"
      - ".github/workflows/audit-ci-autocommit.yml"
  workflow_dispatch:

# CI-P2-002: generated artifacts are proposed through a pull request from a
# short-lived bot branch. The workflow never pushes to a protected branch, so
# `contents: write` is limited to creating that branch/commit and
# `pull-requests: write` to opening/updating the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  audit-auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Regenerate audit dashboard
        run: |
          if [ -d docs/audits/runs ]; then
            python scripts/audits/generate_dashboard.py --repo-root . || true
          fi

      - name: Propose dashboard artifacts
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "chore(audits): refresh dashboard artifacts [skip ci]"
          title: "chore(audits): refresh dashboard artifacts"
          body: |
            Automated refresh of the generated audit dashboard artifacts.

            Opened by `.github/workflows/audit-ci-autocommit.yml` (CI-P2-002);
            the workflow no longer pushes generated files directly to the branch.
          branch: chore/audit-dashboard-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            docs/audits/dashboard/**
            docs/audits/latest_run.json
