name: audit-ci-autocommit

on:
  push:
    branches:
      - main
      - master
      - development
      - dev
      - release/**
    paths:
      - "docs/audits/runs/**"
      - "scripts/audits/generate_dashboard.py"
      - ".github/workflows/audit-ci-autocommit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Regenerate audit dashboard
        run: |
          if [ -d docs/audits/runs ]; then
            python scripts/audits/generate_dashboard.py --repo-root . || true
          fi

      - name: Auto-commit dashboard artifacts
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore(audits): refresh dashboard artifacts [skip ci]"
          file_pattern: docs/audits/dashboard/** docs/audits/latest_run.json
