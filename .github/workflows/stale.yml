name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. Please comment if it's still
            relevant, or it will be closed in 7 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days. Please address review
            feedback or update the branch, or it will be closed in 7 days.
          close-issue-message: "Closing due to inactivity."
          close-pr-message: "Closing due to inactivity."
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,epic
          exempt-pr-labels: pinned,security,dependencies
          operations-per-run: 100
