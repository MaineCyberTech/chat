name: chat-dev

x-common-env: &common-env
  NODE_ENV: development
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    container_name: chat-caddy-dev
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-dev
    depends_on:
      - web
      - api

  web:
    image: chat-web:dev
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: chat-web-dev
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *common-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:80}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:80}
    volumes:
      - ../../apps/web/app:/app/apps/web/app
      - ../../apps/web/components:/app/apps/web/components
      - ../../apps/web/lib:/app/apps/web/lib
      - ../../apps/web/public:/app/apps/web/public
      - ../../packages/ui/src:/app/packages/ui/src
      - ../../packages/db/src:/app/packages/db/src
    ports:
      - "3000:3000"
    networks:
      - chat-dev
    depends_on:
      api:
        condition: service_healthy
    command: ["pnpm", "--filter", "@chat/web", "dev"]

  api:
    image: chat-api:dev
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: chat-api-dev
    restart: unless-stopped
    mem_limit: 192m
    environment:
      <<: *common-env
      PORT: 4000
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_HOST: http://livekit:7880
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_ORIGIN: ${API_ORIGIN:-http://api:4000}
      # Dev default enables GET /metrics so the local Prometheus scrape works
      # out of the box (OBS-P1-001). Production requires a real token.
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-change-me}
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../packages/db/src:/app/packages/db/src
    ports:
      - "4000:4000"
      - "9229:9229"
    networks:
      - chat-dev
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["pnpm", "--filter", "@chat/api", "dev"]

  worker:
    image: chat-worker:dev
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    container_name: chat-worker-dev
    restart: unless-stopped
    mem_limit: 128m
    environment:
      <<: *common-env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - ../../apps/worker/src:/app/apps/worker/src
      - ../../packages/db/src:/app/packages/db/src
    networks:
      - chat-dev
    depends_on:
      redis:
        condition: service_healthy
    command: ["pnpm", "--filter", "@chat/worker", "dev"]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: chat-redis-dev
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: chat-livekit-dev
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882-7892:7882-7892/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_RTC_CONFIG: '{"port_range_start": 7882, "port_range_end": 7892}'
      LIVEKIT_LOG_LEVEL: debug
    command: >
      --config-body="
        port: 7880
        rtc:
          port_range_start: 7882
          port_range_end: 7892
          use_external_ip: true
        turn:
          enabled: false
      "
    networks:
      - chat-dev

  # Prometheus + Alertmanager (OBS-P1-001). Same wiring as production; the dev
  # API defaults to a local METRICS_TOKEN so the scrape is enabled without extra
  # setup. No published ports.
  prometheus:
    image: prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
    container_name: chat-prometheus-dev
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics_token
        && chmod 600 /tmp/metrics_token
        && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
        --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - chat-dev
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: chat-alertmanager-dev
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      CHAT_NTFY_URL: ${CHAT_NTFY_URL:-https://ntfy.mainecybertech.us/chat-alerts}
      CHAT_NTFY_USER: ${CHAT_NTFY_USER:-chat-relay}
      CHAT_NTFY_PASS: ${CHAT_NTFY_PASS:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        awk '{
          gsub(/\$\{CHAT_NTFY_URL\}/, ENVIRON["CHAT_NTFY_URL"]);
          gsub(/\$\{CHAT_NTFY_USER\}/, ENVIRON["CHAT_NTFY_USER"]);
          gsub(/\$\{CHAT_NTFY_PASS\}/, ENVIRON["CHAT_NTFY_PASS"]);
          print
        }' /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        && ! grep -E '\$\{CHAT_NTFY' /tmp/alertmanager.yml | grep -vE '^[[:space:]]*#' | grep -q .
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager --log.level=info
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat-dev

networks:
  chat-dev:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  prometheus-data:
  alertmanager-data:
