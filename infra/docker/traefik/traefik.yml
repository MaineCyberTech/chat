entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

certificatesResolvers:
  le:
    acme:
      email: ${ACME_EMAIL:-admin@mainecybertech.com}
      storage: /acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    exposedByDefault: false
    network: ${DOCKER_NETWORK:-chat-dev}

log:
  level: INFO

api:
  dashboard: false
