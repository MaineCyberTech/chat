name: chat-dev

x-common-env: &common-env
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy-dev
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-dev

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:dev}
    container_name: chat-web-dev
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - chat-dev
    depends_on:
      api:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    container_name: chat-livekit-dev
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "7880:7880"
      - "7882-7892:7882-7892/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: >
      --config-body="
        port: 7880
        rtc:
          port_range_start: 7882
          port_range_end: 7892
          use_external_ip: true
        turn:
          enabled: true
          domain: localhost
          udp_port: 3478
      "
    networks:
      - chat-dev

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mainecybertech/chat/worker:dev}
    container_name: chat-worker-dev
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379
    networks:
      - chat-dev
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: chat-redis-dev
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:dev}
    container_name: chat-api-dev
    restart: unless-stopped
    mem_limit: 192m
    command: ["sh", "-c", "node dist/server.js 2>&1"]
    env_file: .env
    environment:
      <<: *common-env
      PORT: 4000
      NODE_ENV: development
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  chat-dev:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
