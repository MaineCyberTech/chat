name: chat-dev

x-common-env: &common-env
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy-dev
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-dev

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:dev}
    container_name: chat-web-dev
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    env_file: .env
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - chat-dev

  livekit:
    image: livekit/livekit-server:latest
    container_name: chat-livekit-dev
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "7880:7880"
      - "7882-7892:7882-7892/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: >
      --config-body="
        port: 7880
        rtc:
          port_range_start: 7882
          port_range_end: 7892
          use_external_ip: true
        turn:
          enabled: true
          domain: localhost
          udp_port: 3478
      "
    networks:
      - chat-dev

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mainecybertech/chat/worker:dev}
    container_name: chat-worker-dev
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379
    networks:
      - chat-dev
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: chat-redis-dev
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:dev}
    container_name: chat-api-dev
    restart: unless-stopped
    mem_limit: 192m
    env_file: .env
    environment:
      <<: *common-env
      PORT: 4000
      NODE_ENV: development
      # Dev default enables GET /metrics so the local Prometheus scrape works
      # out of the box (OBS-P1-001). Production requires a real token.
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-change-me}
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Prometheus + Alertmanager (OBS-P1-001). Same wiring as the other compose
  # files; no published ports.
  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: chat-prometheus-dev
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics_token
        && chmod 600 /tmp/metrics_token
        && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
        --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - chat-dev
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: chat-alertmanager-dev
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      CHAT_NTFY_URL: ${CHAT_NTFY_URL:-https://ntfy.mainecybertech.us/chat-alerts}
      CHAT_NTFY_USER: ${CHAT_NTFY_USER:-chat-relay}
      CHAT_NTFY_PASS: ${CHAT_NTFY_PASS:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        awk '{
          gsub(/\$\{CHAT_NTFY_URL\}/, ENVIRON["CHAT_NTFY_URL"]);
          gsub(/\$\{CHAT_NTFY_USER\}/, ENVIRON["CHAT_NTFY_USER"]);
          gsub(/\$\{CHAT_NTFY_PASS\}/, ENVIRON["CHAT_NTFY_PASS"]);
          print
        }' /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        && ! grep -E '\$\{CHAT_NTFY' /tmp/alertmanager.yml | grep -vE '^[[:space:]]*#' | grep -q .
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager --log.level=info
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat-dev

networks:
  chat-dev:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  prometheus-data:
  alertmanager-data:
