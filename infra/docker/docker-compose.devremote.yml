name: chat-dev

x-common-env: &common-env
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    container_name: chat-caddy-dev
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
      # 1:1 mapping to MinIO with no path prefix, used only by presigned upload
      # URLs (SigV4 signs the Host header and path, so a prefix-stripping route
      # such as /storage/v1 would invalidate the signature). The Caddyfile
      # serves this on :9001. Not reachable from the internet: only 80/443 are
      # opened in the droplet firewall.
      - "9001:9001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-dev

  # ---------------------------------------------------------------------------
  # Data plane (self-hosted): PostgreSQL + PostgREST.
  # PostgREST serves the same `/rest/v1` protocol the Supabase JS client already
  # speaks, so `supabase.from(...)` call sites and all RLS policies are unchanged.
  # The `auth` schema is intentionally NOT exposed (see supabase/bootstrap/).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: chat-postgres-dev
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat-dev-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chat}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chat-dev

  postgrest:
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    container_name: chat-postgrest-dev
    restart: unless-stopped
    mem_limit: 128m
    environment:
      PGRST_DB_URI: ${DATABASE_URL:-postgres://postgres:chat-dev-postgres@postgres:5432/chat}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Dev-only fallback so the stack is self-contained; production requires a real
      # secret. Mint tokens for a real secret with scripts/db/mint-keys.mjs.
      PGRST_JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-32chars}
      PGRST_SERVER_PORT: 3000
      PGRST_DB_POOL: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat-dev

  # ---------------------------------------------------------------------------
  # Object storage (S3-compatible) for message uploads and avatars. Upstream
  # MinIO images were removed from Docker Hub/Quay in September 2026; this is
  # the community-maintained MinIO fork (PGSTY Silo), which keeps the S3 API,
  # MINIO_* variables and `mc` tooling. Pinned by digest; internal network only.
  # ---------------------------------------------------------------------------
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: chat-minio-dev
    restart: unless-stopped
    mem_limit: 192m
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-chat-minio-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-chat-minio-dev-secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-dev

  # One-shot, idempotent bucket bootstrap (private bucket, matching the old
  # Supabase `chat-uploads` bucket).
  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: chat-minio-init-dev
    restart: "no"
    mem_limit: 64m
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-chat-minio-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-chat-minio-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/chat-uploads
        && mc anonymous set download local/chat-uploads
    networks:
      - chat-dev

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:dev}
    container_name: chat-web-dev
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      # 127.0.0.1, not localhost: Alpine's resolver returns ::1 for localhost and
      # Next.js binds IPv4 here, so the check always failed.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    env_file: .env
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - chat-dev

  livekit:
    image: livekit/livekit-server:latest@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: chat-livekit-dev
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "7880:7880"
      - "7882-7892:7882-7892/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: >
      --config-body="
        port: 7880
        rtc:
          port_range_start: 7882
          port_range_end: 7892
          use_external_ip: true
        turn:
          enabled: true
          domain: localhost
          udp_port: 3478
      "
    networks:
      - chat-dev

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mainecybertech/chat/worker:dev}
    container_name: chat-worker-dev
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      # 127.0.0.1, not localhost: Alpine's resolver returns ::1 for localhost and
      # the health server binds IPv4 loopback only, so the check always failed.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379
    networks:
      - chat-dev
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: chat-redis-dev
    restart: unless-stopped
    mem_limit: 192m
    # maxmemory is set below the container limit so Redis fails soft (write
    # errors) instead of being OOM-killed by the cgroup, which is what caused a
    # crash loop when the dataset outgrew a 64m limit. `noeviction` is what
    # BullMQ requires: evicting keys mid-job can corrupt queue state.
    command: redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy noeviction
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:dev}
    container_name: chat-api-dev
    restart: unless-stopped
    mem_limit: 192m
    env_file: .env
    environment:
      <<: *common-env
      PORT: 4000
      NODE_ENV: development
      # Dev default enables GET /metrics so the local Prometheus scrape works
      # out of the box (OBS-P1-001). Production requires a real token.
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-change-me}
    networks:
      - chat-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Prometheus + Alertmanager (OBS-P1-001). Same wiring as the other compose
  # files; no published ports.
  prometheus:
    image: prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
    container_name: chat-prometheus-dev
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics_token
        && chmod 600 /tmp/metrics_token
        && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
        --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - chat-dev
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: chat-alertmanager-dev
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      CHAT_NTFY_URL: ${CHAT_NTFY_URL:-https://ntfy.mainecybertech.us/chat-alerts}
      CHAT_NTFY_USER: ${CHAT_NTFY_USER:-chat-relay}
      CHAT_NTFY_PASS: ${CHAT_NTFY_PASS:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        awk '{
          gsub(/\$\{CHAT_NTFY_URL\}/, ENVIRON["CHAT_NTFY_URL"]);
          gsub(/\$\{CHAT_NTFY_USER\}/, ENVIRON["CHAT_NTFY_USER"]);
          gsub(/\$\{CHAT_NTFY_PASS\}/, ENVIRON["CHAT_NTFY_PASS"]);
          print
        }' /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        && ! grep -E '\$\{CHAT_NTFY' /tmp/alertmanager.yml | grep -vE '^[[:space:]]*#' | grep -q .
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager --log.level=info
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat-dev

networks:
  chat-dev:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  minio-data:
