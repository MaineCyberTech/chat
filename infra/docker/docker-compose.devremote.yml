name: chat-dev

x-common-env: &common-env
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy-dev
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-dev

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:dev}
    container_name: chat-web-dev
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - chat-dev
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:dev}
    container_name: chat-api-dev
    restart: unless-stopped
    mem_limit: 192m
    command: ["sh", "-c", "node dist/server.js 2>&1"]
    env_file: .env
    environment:
      <<: *common-env
      PORT: 4000
      NODE_ENV: development
    networks:
      - chat-dev

networks:
  chat-dev:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
