name: chat-prod

x-common-env: &common-env
  NODE_ENV: production
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy-prod
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-prod

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:latest}
    container_name: chat-web-prod
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *common-env
      PORT: 3000
    networks:
      - chat-prod
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:latest}
    container_name: chat-api-prod
    restart: unless-stopped
    mem_limit: 192m
    environment:
      <<: *common-env
      PORT: 4000
    networks:
      - chat-prod

networks:
  chat-prod:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
