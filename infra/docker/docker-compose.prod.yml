name: chat-prod

x-common-env: &common-env
  NODE_ENV: production
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy-prod
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-prod

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:latest}
    container_name: chat-web-prod
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *common-env
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chat-prod
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mainecybertech/chat/worker:latest}
    container_name: chat-worker-prod
    restart: unless-stopped
    mem_limit: 128m
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-prod
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: chat-redis-prod
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes
    networks:
      - chat-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: chat-livekit-prod
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:7881:7881"
      - "7880:7880"
      - "7882-7892:7882-7892/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_CONFIG: '{"port_range_start": 7882, "port_range_end": 7892}'
      LIVEKIT_LOG_LEVEL: info
    command: >
      --config-body="
        port: 7880
        rtc:
          port_range_start: 7882
          port_range_end: 7892
          use_external_ip: true
        turn:
          enabled: true
          domain: ${DOMAIN:-chat.mainecybertech.com}
          tls_port: 5349
          udp_port: 3478
      "
    networks:
      - chat-prod

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:latest}
    container_name: chat-api-prod
    restart: unless-stopped
    mem_limit: 192m
    environment:
      <<: *common-env
      PORT: 4000
      REDIS_URL: redis://redis:6379
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HOST: http://livekit:7880
    networks:
      - chat-prod
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  chat-prod:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
