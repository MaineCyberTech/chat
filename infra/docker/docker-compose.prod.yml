name: chat-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-prod

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:latest}
    container_name: chat-web-prod
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - NODE_OPTIONS=--max-old-space-size=192
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat-prod

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:latest}
    container_name: chat-api-prod
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - NODE_OPTIONS=--max-old-space-size=96
    env_file:
      - .env.prod
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - chat-prod

networks:
  chat-prod:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
