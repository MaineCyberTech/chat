name: chat-prod

x-common-env: &common-env
  NODE_ENV: production
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  # SUPABASE_SERVICE_ROLE_KEY is intentionally NOT part of the shared env: the
  # internet-facing web tier must not hold full DB privileges. It is injected
  # only into api/worker below (chat-SUPPLY-001).

services:
  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    container_name: chat-caddy-prod
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chat-prod

  # ---------------------------------------------------------------------------
  # Data plane (self-hosted): PostgreSQL + PostgREST.
  # See docs/adr/0002-postgres-postgrest-custom-auth.md. The `auth` schema is
  # intentionally NOT exposed (supabase/bootstrap/00_auth_shim.sql).
  # POSTGRES_PASSWORD / JWT_SECRET are required here (no fallback): production
  # must fail fast rather than come up with a guessable secret.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: chat-postgres-prod
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=8MB
      -c max_connections=80
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chat}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chat-prod

  postgrest:
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    container_name: chat-postgrest-prod
    restart: unless-stopped
    mem_limit: 192m
    environment:
      PGRST_DB_URI: ${DATABASE_URL:?DATABASE_URL is required}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PGRST_SERVER_PORT: 3000
      PGRST_DB_POOL: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat-prod

  # ---------------------------------------------------------------------------
  # Object storage (S3-compatible) for message uploads and avatars. Upstream
  # MinIO images were removed from Docker Hub/Quay in September 2026; this is
  # the community-maintained MinIO fork (PGSTY Silo), which keeps the S3 API,
  # MINIO_* variables and `mc` tooling. Pinned by digest; internal network only.
  # S3_ACCESS_KEY / S3_SECRET_KEY are required: production must fail fast
  # rather than come up with guessable root credentials.
  # ---------------------------------------------------------------------------
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: chat-minio-prod
    restart: unless-stopped
    mem_limit: 384m
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-prod

  # One-shot, idempotent bucket bootstrap (private bucket, matching the old
  # Supabase `chat-uploads` bucket).
  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: chat-minio-init-prod
    restart: "no"
    mem_limit: 64m
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/chat-uploads
        && mc anonymous set download local/chat-uploads
    networks:
      - chat-prod

  web:
    image: ${WEB_IMAGE:-ghcr.io/mainecybertech/chat/web:latest}
    container_name: chat-web-prod
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *common-env
      PORT: 3000
    healthcheck:
      # 127.0.0.1, not localhost — see docker-compose.devremote.yml.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chat-prod
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/mainecybertech/chat/worker:latest}
    container_name: chat-worker-prod
    restart: unless-stopped
    mem_limit: 128m
    environment:
      <<: *common-env
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379
      METRICS_TOKEN: ${METRICS_TOKEN}
      # Shared symmetric key for webhook signing-secret encryption/decryption
      # (SEC-P2-001). Must match the API's value or retries cannot be signed.
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-chat-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://chat.mainecybertech.com/storage/v1/chat-uploads}
      # Presigned URLs must be signed for a browser-reachable host that maps 1:1
      # to MinIO (no path prefix), otherwise SigV4 validation fails.
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-https://chat-storage.mainecybertech.com}
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      # 127.0.0.1, not localhost — see docker-compose.devremote.yml.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-prod
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: chat-redis-prod
    restart: unless-stopped
    mem_limit: 192m
    # See docker-compose.devremote.yml: bound Redis below the container limit and
    # keep BullMQ's required noeviction policy.
    command: redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy noeviction
    networks:
      - chat-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: chat-livekit-prod
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:7881:7881"
      - "7880:7880"
      - "7882-7892:7882-7892/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_CONFIG: '{"port_range_start": 7882, "port_range_end": 7892}'
      LIVEKIT_LOG_LEVEL: info
    command: >
      --config-body="
        port: 7880
        rtc:
          port_range_start: 7882
          port_range_end: 7892
          use_external_ip: true
        turn:
          enabled: true
          domain: ${DOMAIN:-chat.mainecybertech.com}
          tls_port: 5349
          udp_port: 3478
      "
    networks:
      - chat-prod

  api:
    image: ${API_IMAGE:-ghcr.io/mainecybertech/chat/api:latest}
    container_name: chat-api-prod
    restart: unless-stopped
    mem_limit: 192m
    environment:
      <<: *common-env
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PORT: 4000
      REDIS_URL: redis://redis:6379
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HOST: http://livekit:7880
      METRICS_TOKEN: ${METRICS_TOKEN}
      # Shared symmetric key for webhook signing-secret encryption/decryption
      # (SEC-P2-001). Must match the worker's value.
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-chat-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://chat.mainecybertech.com/storage/v1/chat-uploads}
      # Presigned URLs must be signed for a browser-reachable host that maps 1:1
      # to MinIO (no path prefix), otherwise SigV4 validation fails.
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-https://chat-storage.mainecybertech.com}
      S3_FORCE_PATH_STYLE: "true"
    networks:
      - chat-prod
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Prometheus scrapes the API's token-gated /metrics and evaluates the checked-in
  # rules (OBS-P1-001). No published ports: Prometheus only talks to the
  # Alertmanager service and the API over the compose network.
  prometheus:
    image: prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
    container_name: chat-prometheus-prod
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    environment:
      # Prometheus has no ${VAR} expansion for scrape credentials. Write the
      # bearer token to a file before starting so prometheus.yml can read it via
      # credentials_file (never embedded in the config or the command line).
      METRICS_TOKEN: ${METRICS_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics_token
        && chmod 600 /tmp/metrics_token
        && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
        --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - chat-prod
    depends_on:
      alertmanager:
        condition: service_healthy

  # Alertmanager routes firing Prometheus alerts to the self-hosted ntfy topic
  # (OBS-P1-001). The config is a ${CHAT_NTFY_*} template rendered at startup;
  # the ntfy password comes from the environment and is never committed.
  # Defaults keep the receiver pointed at https://ntfy.mainecybertech.us/chat-alerts.
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: chat-alertmanager-prod
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      CHAT_NTFY_URL: ${CHAT_NTFY_URL:-https://ntfy.mainecybertech.us/chat-alerts}
      CHAT_NTFY_USER: ${CHAT_NTFY_USER:-chat-relay}
      CHAT_NTFY_PASS: ${CHAT_NTFY_PASS:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        awk '{
          gsub(/\$\{CHAT_NTFY_URL\}/, ENVIRON["CHAT_NTFY_URL"]);
          gsub(/\$\{CHAT_NTFY_USER\}/, ENVIRON["CHAT_NTFY_USER"]);
          gsub(/\$\{CHAT_NTFY_PASS\}/, ENVIRON["CHAT_NTFY_PASS"]);
          print
        }' /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        && ! grep -E '\$\{CHAT_NTFY' /tmp/alertmanager.yml | grep -vE '^[[:space:]]*#' | grep -q .
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager --log.level=info
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat-prod

networks:
  chat-prod:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  minio-data:
