# Prometheus configuration for the Chat platform (OBS-P1-001).
#
# Runs inside the compose network with no published ports. `GET /metrics` on the
# API is token-gated by requireMetricsAccess (apps/api/src/lib/metrics.ts), so
# the scrape job authenticates with the shared METRICS_TOKEN. Prometheus has no
# shell-style env expansion for scrape credentials (unlike Alertmanager's
# template), so the compose entrypoint writes the token to /tmp/metrics_token and
# this file references it via `credentials_file`. The token is never committed.
#
# Validate with: promtool check config infra/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

# Forward firing alerts to Alertmanager, which routes them to ntfy.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: chat-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: api

  # Scrape Prometheus itself so `up{job="prometheus"}` is available for
  # monitoring-the-monitor rules.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
