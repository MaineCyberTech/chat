<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Executive Audit Dashboard</title>
    <style>
      body {
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
        margin: 24px;
        color: #111;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <h1>Executive Audit Dashboard</h1>
    <div class="card">
      <h2>Current Posture</h2>
      <p><strong>Decision:</strong> NO-GO</p>
      <p><strong>Readiness:</strong> 70.00</p>
      <p><strong>P0/P1:</strong> 1 / 3</p>
    </div>
    <div class="card">
      <h2>Recommended Action</h2>
      <p>Proceed only if gate and sign-off requirements are satisfied.</p>
    </div>
  </body>
</html>
